<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Linear Transformation Visualizer</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
    --axis: #4b5563;
    --grid: #e5e7eb;
    --xvec: #2563eb;
    --axvec: #dc2626;
    --button: #111827;
    --buttonText: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.9rem;
  }

  .subtitle {
    margin: 0 0 22px;
    color: var(--muted);
    line-height: 1.45;
  }

  .layout {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 20px;
    align-items: start;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }

  .section-title {
    margin: 0 0 12px;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .vector-inputs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .matrix {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: .88rem;
    color: var(--muted);
  }

  input {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    background: #fff;
  }

  input:focus {
    outline: 2px solid #93c5fd;
    border-color: #60a5fa;
  }

  .spacer { height: 18px; }

  button {
    width: 100%;
    margin-top: 18px;
    min-height: 44px;
    border: 0;
    border-radius: 9px;
    background: var(--button);
    color: var(--buttonText);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  button:hover { opacity: .92; }

  .results {
    margin-top: 18px;
    display: grid;
    gap: 12px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .blue { color: var(--xvec); font-weight: 700; }
  .red { color: var(--axvec); font-weight: 700; }

  .column-vector {
    display: inline-grid;
    position: relative;
    padding: 3px 12px;
    line-height: 1.15;
    text-align: center;
    min-width: 54px;
  }

  .column-vector::before,
  .column-vector::after {
    content: "";
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 10px;
    border: 2px solid currentColor;
  }

  .column-vector::before {
    left: 0;
    border-right: 0;
    border-radius: 50% 0 0 50%;
  }

  .column-vector::after {
    right: 0;
    border-left: 0;
    border-radius: 0 50% 50% 0;
  }

  .column-vector span {
    display: block;
    padding: 1px 4px;
  }

  .plot-card {
    padding: 14px;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
    background: #fff;
    border-radius: 10px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  svg.dragging {
    cursor: grabbing;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 12px;
    font-size: .95rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .swatch {
    width: 18px;
    height: 4px;
    border-radius: 2px;
  }

  .note {
    margin-top: 12px;
    color: var(--muted);
    font-size: .88rem;
    line-height: 1.4;
  }

  .error {
    min-height: 22px;
    margin-top: 10px;
    color: #b91c1c;
    font-size: .9rem;
  }

  @media (max-width: 840px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>3D Linear Transformation Visualizer</h1>
  <p class="subtitle">
    Enter a vector <strong>x ∈ ℝ³</strong> and a 3×3 matrix <strong>A</strong>.
    The app plots both <strong>x</strong> and <strong>Ax</strong> using a 3D-style projection.
  </p>

  <div class="layout">
    <section class="card">
      <h2 class="section-title">Vector x</h2>
      <div class="vector-inputs">
        <label>
          x₁
          <input id="x1" type="number" step="any" value="2">
        </label>
        <label>
          x₂
          <input id="x2" type="number" step="any" value="1">
        </label>
        <label>
          x₃
          <input id="x3" type="number" step="any" value="2">
        </label>
      </div>

      <div class="spacer"></div>

      <h2 class="section-title">Matrix A</h2>
      <div class="matrix">
        <label>a₁₁<input id="a11" type="number" step="any" value="1"></label>
        <label>a₁₂<input id="a12" type="number" step="any" value="0"></label>
        <label>a₁₃<input id="a13" type="number" step="any" value="0"></label>

        <label>a₂₁<input id="a21" type="number" step="any" value="0"></label>
        <label>a₂₂<input id="a22" type="number" step="any" value="1"></label>
        <label>a₂₃<input id="a23" type="number" step="any" value="0"></label>

        <label>a₃₁<input id="a31" type="number" step="any" value="0"></label>
        <label>a₃₂<input id="a32" type="number" step="any" value="0"></label>
        <label>a₃₃<input id="a33" type="number" step="any" value="1"></label>
      </div>

      <button id="plotBtn" type="button">Plot Transformation</button>
      <div id="error" class="error" aria-live="polite"></div>

      <div class="results">
        <div class="result-row">
          <span class="blue">x</span>
          <span id="xDisplay" class="column-vector">
            <span>2</span><span>1</span><span>2</span>
          </span>
        </div>

        <div class="result-row">
          <span class="red">Ax</span>
          <span id="axDisplay" class="column-vector">
            <span>2</span><span>1</span><span>2</span>
          </span>
        </div>
      </div>

      <p class="note">
        Click and drag directly on the graph to rotate the 3D view.
      </p>
    </section>

    <section class="card plot-card">
      <svg id="plot" viewBox="0 0 760 700" role="img" aria-label="3D-style coordinate system showing x and Ax">
        <defs>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"></path>
          </marker>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"></path>
          </marker>
        </defs>
        <g id="gridLayer"></g>
        <g id="axisLayer"></g>
        <g id="vectorLayer"></g>
      </svg>

      <div class="legend">
        <div class="legend-item">
          <span class="swatch" style="background:#2563eb"></span>
          <span><strong>x</strong></span>
        </div>
        <div class="legend-item">
          <span class="swatch" style="background:#dc2626"></span>
          <span><strong>Ax</strong></span>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const ids = [
    "x1","x2","x3",
    "a11","a12","a13",
    "a21","a22","a23",
    "a31","a32","a33"
  ];

  const inputs = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const plotBtn = document.getElementById("plotBtn");
  const plot = document.getElementById("plot");
  const error = document.getElementById("error");
  const xDisplay = document.getElementById("xDisplay");
  const axDisplay = document.getElementById("axDisplay");
  const gridLayer = document.getElementById("gridLayer");
  const axisLayer = document.getElementById("axisLayer");
  const vectorLayer = document.getElementById("vectorLayer");

  const W = 760;
  const H = 700;
  const cx = W / 2;
  const cy = H / 2 + 15;

  function svgEl(tag, attrs = {}) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  function fmt(n) {
    const rounded = Math.abs(n) < 1e-10 ? 0 : n;
    return Number.isInteger(rounded) ? String(rounded) : String(Number(rounded.toFixed(3)));
  }

  function readValues() {
    const vals = {};
    for (const id of ids) {
      const v = Number(inputs[id].value);
      if (!Number.isFinite(v)) {
        throw new Error("Please enter a valid number in every box.");
      }
      vals[id] = v;
    }
    return vals;
  }

  function multiply(A, x) {
    return [
      A[0][0]*x[0] + A[0][1]*x[1] + A[0][2]*x[2],
      A[1][0]*x[0] + A[1][1]*x[1] + A[1][2]*x[2],
      A[2][0]*x[0] + A[2][1]*x[1] + A[2][2]*x[2]
    ];
  }

  function maxAbsFor(vectors) {
    let m = 1;
    for (const v of vectors) {
      for (const c of v) m = Math.max(m, Math.abs(c));
    }
    return m;
  }

  function chooseScale(vectors) {
    const maxAbs = maxAbsFor(vectors);
    const targetHalfUnits = maxAbs * 1.35;
    const rawStep = targetHalfUnits / 4;

    const power = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const normalized = rawStep / power;

    let nice;
    if (normalized <= 1) nice = 1;
    else if (normalized <= 2) nice = 2;
    else if (normalized <= 5) nice = 5;
    else nice = 10;

    const gridStep = nice * power;
    const halfRange = gridStep * 4;
    const scale = 235 / halfRange;

    return { gridStep, scale };
  }

  let yaw = -0.7;
  let pitch = 0.55;
  let currentX = [2,1,2];
  let currentY = [2,1,2];
  let currentGridStep = 1;
  let currentScale = 1;

  function rotatePoint(v) {
    const [x, y, z] = v;

    // Rotate around z-axis (yaw)
    const cyaw = Math.cos(yaw);
    const syaw = Math.sin(yaw);
    const x1 = x * cyaw - y * syaw;
    const y1 = x * syaw + y * cyaw;
    const z1 = z;

    // Rotate around x-axis (pitch)
    const cp = Math.cos(pitch);
    const sp = Math.sin(pitch);
    const x2 = x1;
    const y2 = y1 * cp - z1 * sp;
    const z2 = y1 * sp + z1 * cp;

    return [x2, y2, z2];
  }

  function project(v, scale) {
    const [rx, ry, rz] = rotatePoint(v);

    // Orthographic projection after rotation.
    return [
      cx + scale * rx,
      cy - scale * rz
    ];
  }

  function drawAxes(gridStep, scale) {
    gridLayer.replaceChildren();
    axisLayer.replaceChildren();

    // Light guide parallelograms on coordinate planes.
    for (let k = -4; k <= 4; k++) {
      if (k === 0) continue;
      const val = k * gridStep;

      // Lines parallel to x1 in x1-x2 plane
      let p1 = project([-4*gridStep, val, 0], scale);
      let p2 = project([ 4*gridStep, val, 0], scale);
      gridLayer.appendChild(svgEl("line", {
        x1:p1[0], y1:p1[1], x2:p2[0], y2:p2[1],
        stroke:"#eef0f3", "stroke-width":1
      }));

      // Lines parallel to x2 in x1-x2 plane
      p1 = project([val, -4*gridStep, 0], scale);
      p2 = project([val,  4*gridStep, 0], scale);
      gridLayer.appendChild(svgEl("line", {
        x1:p1[0], y1:p1[1], x2:p2[0], y2:p2[1],
        stroke:"#eef0f3", "stroke-width":1
      }));
    }

    const axes = [
      { end:[4.7*gridStep,0,0], label:"x₁", dx:10, dy:4 },
      { end:[0,4.7*gridStep,0], label:"x₂", dx:10, dy:-2 },
      { end:[0,0,4.7*gridStep], label:"x₃", dx:10, dy:-4 }
    ];

    for (const axis of axes) {
      const p0 = project([0,0,0], scale);
      const p1 = project(axis.end, scale);

      axisLayer.appendChild(svgEl("line", {
        x1:p0[0], y1:p0[1], x2:p1[0], y2:p1[1],
        stroke:"#4b5563", "stroke-width":2.5
      }));

      const lab = svgEl("text", {
        x:p1[0] + axis.dx,
        y:p1[1] + axis.dy,
        "font-size":16,
        fill:"#374151"
      });
      lab.textContent = axis.label;
      axisLayer.appendChild(lab);
    }

    // Negative axis directions
    for (const end of [
      [-4.7*gridStep,0,0],
      [0,-4.7*gridStep,0],
      [0,0,-4.7*gridStep]
    ]) {
      const p0 = project([0,0,0], scale);
      const p1 = project(end, scale);
      axisLayer.appendChild(svgEl("line", {
        x1:p0[0], y1:p0[1], x2:p1[0], y2:p1[1],
        stroke:"#9ca3af", "stroke-width":1.5, "stroke-dasharray":"5 5"
      }));
    }

    // Tick labels on positive directions.
    for (let k = 1; k <= 4; k++) {
      const val = k * gridStep;
      const tickData = [
        {v:[val,0,0], dx:0, dy:18},
        {v:[0,val,0], dx:10, dy:14},
        {v:[0,0,val], dx:10, dy:4}
      ];

      for (const td of tickData) {
        const p = project(td.v, scale);
        const t = svgEl("text", {
          x:p[0]+td.dx,
          y:p[1]+td.dy,
          "font-size":13,
          fill:"#6b7280"
        });
        t.textContent = fmt(val);
        axisLayer.appendChild(t);
      }
    }
  }

  function drawVector(v, color, marker, label, scale, offsetY) {
    const p0 = project([0,0,0], scale);
    const p1 = project(v, scale);

    vectorLayer.appendChild(svgEl("line", {
      x1:p0[0], y1:p0[1], x2:p1[0], y2:p1[1],
      stroke:color,
      "stroke-width":5,
      "stroke-linecap":"round",
      "marker-end":`url(#${marker})`
    }));

    vectorLayer.appendChild(svgEl("circle", {
      cx:p1[0], cy:p1[1], r:5.5, fill:color
    }));

    const text = svgEl("text", {
      x:p1[0] + 12,
      y:p1[1] + offsetY,
      "font-size":17,
      "font-weight":700,
      fill:color
    });
    text.textContent = `${label} = (${fmt(v[0])}, ${fmt(v[1])}, ${fmt(v[2])})`;
    vectorLayer.appendChild(text);
  }

  function setColumnVector(el, v) {
    el.replaceChildren(
      Object.assign(document.createElement("span"), { textContent: fmt(v[0]) }),
      Object.assign(document.createElement("span"), { textContent: fmt(v[1]) }),
      Object.assign(document.createElement("span"), { textContent: fmt(v[2]) })
    );
  }

  function redraw() {
    drawAxes(currentGridStep, currentScale);
    vectorLayer.replaceChildren();

    drawVector(currentX, "#2563eb", "arrowBlue", "x", currentScale, -12);
    drawVector(currentY, "#dc2626", "arrowRed", "Ax", currentScale, 24);
  }

  function update() {
    try {
      const v = readValues();
      error.textContent = "";

      const x = [v.x1, v.x2, v.x3];

      const A = [
        [v.a11, v.a12, v.a13],
        [v.a21, v.a22, v.a23],
        [v.a31, v.a32, v.a33]
      ];

      const y = multiply(A, x);

      setColumnVector(xDisplay, x);
      setColumnVector(axDisplay, y);

      const { gridStep, scale } = chooseScale([x, y]);

      currentX = x;
      currentY = y;
      currentGridStep = gridStep;
      currentScale = scale;

      redraw();

    } catch (err) {
      error.textContent = err.message;
    }
  }

  plotBtn.addEventListener("click", update);

  for (const input of Object.values(inputs)) {
    input.addEventListener("input", update);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") update();
    });
  }

  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  plot.addEventListener("pointerdown", e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    plot.classList.add("dragging");
    plot.setPointerCapture(e.pointerId);
  });

  plot.addEventListener("pointermove", e => {
    if (!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    lastX = e.clientX;
    lastY = e.clientY;

    yaw += dx * 0.01;
    pitch += dy * 0.01;

    // Prevent the camera from flipping completely upside down.
    const limit = Math.PI / 2 - 0.05;
    pitch = Math.max(-limit, Math.min(limit, pitch));

    redraw();
  });

  function stopDragging(e) {
    dragging = false;
    plot.classList.remove("dragging");
    if (plot.hasPointerCapture && plot.hasPointerCapture(e.pointerId)) {
      plot.releasePointerCapture(e.pointerId);
    }
  }

  plot.addEventListener("pointerup", stopDragging);
  plot.addEventListener("pointercancel", stopDragging);

  update();
})();
</script>
</body>
</html>
