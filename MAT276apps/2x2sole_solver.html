<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2×2 System Solver</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 24px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .math-box {
      background: #f8fafc;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>2×2 System Solver</h1>

    <div class="math-box">
      $$
      \begin{cases}
      a k_1 + b k_2 = f_1 \\
      c k_1 + d k_2 = f_2
      \end{cases}
      $$
    </div>

    <h3>Equation 1</h3>
    <div class="grid">
      <div>
        <label>a</label>
        <input id="a" type="number" />
      </div>
      <div>
        <label>b</label>
        <input id="b" type="number" />
      </div>
      <div>
        <label>f₁</label>
        <input id="f1" type="number" />
      </div>
    </div>

    <h3>Equation 2</h3>
    <div class="grid">
      <div>
        <label>c</label>
        <input id="c" type="number" />
      </div>
      <div>
        <label>d</label>
        <input id="d" type="number" />
      </div>
      <div>
        <label>f₂</label>
        <input id="f2" type="number" />
      </div>
    </div>

    <button onclick="solve()">Solve</button>
    <button onclick="clearAll()" style="background:#9ca3af;">Clear</button>

    <div id="result"></div>
  </div>

  <script>
    function fmt(x) {
      if (!isFinite(x)) return x;
      return Number(x.toFixed(6));
    }

    function solve() {
      const a = parseFloat(document.getElementById("a").value);
      const b = parseFloat(document.getElementById("b").value);
      const c = parseFloat(document.getElementById("c").value);
      const d = parseFloat(document.getElementById("d").value);
      const f1 = parseFloat(document.getElementById("f1").value);
      const f2 = parseFloat(document.getElementById("f2").value);

      const resultDiv = document.getElementById("result");

      if ([a,b,c,d,f1,f2].some(v => isNaN(v))) {
        resultDiv.className = "result error";
        resultDiv.innerHTML = "Please fill in all values.";
        return;
      }

      const det = a*d - b*c;

      if (Math.abs(det) < 1e-10) {
        resultDiv.className = "result error";
        resultDiv.innerHTML = "No unique solution.";
        return;
      }

      const k1 = (f1*d - b*f2) / det;
      const k2 = (a*f2 - f1*c) / det;

      resultDiv.className = "result";
      resultDiv.innerHTML = `
        \\[
        k_1 = ${fmt(k1)}, \\quad k_2 = ${fmt(k2)}
        \\]
      `;

      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ]
      });
    }

    function clearAll() {
      ["a","b","c","d","f1","f2"].forEach(id => {
        document.getElementById(id).value = "";
      });
      document.getElementById("result").innerHTML = "";
    }

    window.onload = () => {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ]
      });
    };
  </script>
</body>
</html>
