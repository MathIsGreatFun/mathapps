<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Partial Derivative Calculator</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 30px;
  color: #222;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.14);
}

h1 {
  text-align: center;
  color: #1f3a5f;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 10px;
}

.top-note {
  text-align: center;
  background: #fff4e5;
  border: 1px solid #f0c36d;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 25px;
  font-size: 14px;
}

.input-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

input {
  width: 430px;
  max-width: 100%;
  padding: 12px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 8px;
}

button {
  padding: 12px 18px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #1f5f99;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #16466f;
}

.clear-btn {
  background: #777;
}

.clear-btn:hover {
  background: #555;
}

.results {
  margin-top: 25px;
  padding: 20px;
  background: #f8fafc;
  border-left: 5px solid #1f5f99;
  border-radius: 8px;
  min-height: 80px;
}

.math-line {
  font-size: 20px;
  margin: 20px 0;
  overflow-x: auto;
}

.note {
  text-align: center;
  color: #666;
  font-size: 14px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Partial Derivative Calculator</h1>

  <p class="subtitle">
    Enter a function \(f(x,y)\).
  </p>

  <div class="top-note">
    <strong>Important:</strong> Use explicit multiplication. Write <code>x*y</code>, not <code>xy</code>.
  </div>

  <div class="input-row">
    <input id="functionInput" type="text" placeholder="Example: x^2*y + sin(x*y)">
    <button onclick="computePartials()">Calculate</button>
    <button class="clear-btn" onclick="clearApp()">Clear</button>
  </div>

  <div id="results" class="results"></div>

  <p class="note">
    Examples: <code>x^2*y + sin(x*y)</code>, <code>exp(x*y)</code>, <code>sqrt(x+y)</code>
  </p>
</div>

<script>
function preprocessInput(input) {
  return input
    .replace(/\s+/g, "")
    .replace(/e\^/g, "exp");
}

function renderMath(element, latex) {
  katex.render(latex, element, {
    throwOnError: false,
    displayMode: true
  });
}

function computePartials() {
  const rawInput = document.getElementById("functionInput").value.trim();
  const input = preprocessInput(rawInput);
  const results = document.getElementById("results");

  results.innerHTML = "";

  if (!input) return;

  try {
    const fxExpr = nerdamer(`diff(${input}, x)`);
    const fyExpr = nerdamer(`diff(${input}, y)`);

    const fxLatex = fxExpr.toTeX();
    const fyLatex = fyExpr.toTeX();

    const line1 = document.createElement("div");
    line1.className = "math-line";

    const line2 = document.createElement("div");
    line2.className = "math-line";

    results.appendChild(line1);
    results.appendChild(line2);

    renderMath(line1, "\\frac{\\partial f}{\\partial x} = " + fxLatex);
    renderMath(line2, "\\frac{\\partial f}{\\partial y} = " + fyLatex);

  } catch (error) {
    results.innerHTML = "<p>Invalid function.</p>";
  }
}

function clearApp() {
  document.getElementById("functionInput").value = "";
  document.getElementById("results").innerHTML = "";
}

// THIS FIXES YOUR \(f(x,y)\) ISSUE
document.addEventListener("DOMContentLoaded", function() {
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\(", right: "\\)", display: false},
      {left: "\\[", right: "\\]", display: true}
    ]
  });
});
</script>
</body>
</html>
