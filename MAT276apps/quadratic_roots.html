<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quadratic Roots Calculator</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
.app { max-width:600px; margin:auto; background:white; padding:20px; border-radius:8px; border:1px solid #ccc; }
h1 { text-align:center; margin-bottom:10px; }
.center { text-align:center; margin-bottom:15px; }
.row { display:flex; gap:10px; margin-bottom:10px; }
label { width:40px; font-weight:bold; }
input { flex:1; padding:6px; }
button { width:100%; padding:10px; margin-top:10px; background:#2d6cdf; color:white; border:none; border-radius:4px; }
.result { margin-top:20px; padding:15px; background:#fafafa; border:1px solid #ddd; border-radius:6px; }
.math { margin:8px 0; }
</style>
</head>

<body>
<div class="app">
  <h1>Quadratic Roots Calculator</h1>

  <div class="center">Solve</div>
  <div id="eq" class="center"></div>

  <div class="row">
    <label>a =</label>
    <input id="a" type="number" value="1">
  </div>

  <div class="row">
    <label>b =</label>
    <input id="b" type="number" value="0">
  </div>

  <div class="row">
    <label>c =</label>
    <input id="c" type="number" value="0">
  </div>

  <button onclick="solve()">Calculate Roots</button>

  <div id="out" class="result"></div>
</div>

<script>
function render(id, tex){
  katex.render(tex, document.getElementById(id), {displayMode:true});
}

function round2(x){
  return (Math.round(x*100)/100).toFixed(2);
}

function solve(){
  let a = parseFloat(aInput.value);
  let b = parseFloat(bInput.value);
  let c = parseFloat(cInput.value);

  if(a===0){ out.innerHTML="Not quadratic"; return; }

  let D = b*b - 4*a*c;

  out.innerHTML = `
    <div class="math" id="e1"></div>
    <div class="math" id="e2"></div>
    <div class="math" id="r1"></div>
    <div class="math" id="r2"></div>
  `;

  if(D>=0){
    let x1 = (-b + Math.sqrt(D))/(2*a);
    let x2 = (-b - Math.sqrt(D))/(2*a);

    render("e1", `x_1 = \\frac{-${b} + \\sqrt{${D}}}{${2*a}}`);
    render("e2", `x_2 = \\frac{-${b} - \\sqrt{${D}}}{${2*a}}`);

    render("r1", `x_1 \\approx ${round2(x1)}`);
    render("r2", `x_2 \\approx ${round2(x2)}`);

  } else {
    let real = -b/(2*a);
    let imag = Math.sqrt(-D)/(2*a);

    render("e1", `x_1 = \\frac{-${b}}{${2*a}} + \\frac{\\sqrt{${-D}}}{${2*a}}i`);
    render("e2", `x_2 = \\frac{-${b}}{${2*a}} - \\frac{\\sqrt{${-D}}}{${2*a}}i`);

    render("r1", `x_1 \\approx ${round2(real)} + ${round2(imag)}i`);
    render("r2", `x_2 \\approx ${round2(real)} - ${round2(imag)}i`);
  }
}

window.onload = () => {
  render("eq","ax^2 + bx + c = 0");
};
</script>

</body>
</html>
