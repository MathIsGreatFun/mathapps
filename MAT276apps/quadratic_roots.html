<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quadratic Roots Calculator</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body);"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 24px;
    }

    .app {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .equation {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      width: 40px;
      font-weight: bold;
    }

    input {
      flex: 1;
      padding: 6px 8px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #2d6cdf;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #1f57b8;
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 60px;
    }

    .formula {
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Quadratic Roots Calculator</h1>

    <div class="equation">
      \( ax^2 + bx + c = 0 \)
    </div>

    <div class="row">
      <label>a =</label>
      <input type="number" id="a" step="any" value="1">
    </div>

    <div class="row">
      <label>b =</label>
      <input type="number" id="b" step="any" value="0">
    </div>

    <div class="row">
      <label>c =</label>
      <input type="number" id="c" step="any" value="0">
    </div>

    <button onclick="calculate()">Calculate Roots</button>

    <div class="result" id="result"></div>

    <div class="formula">
      \( x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a} \)
    </div>
  </div>

  <script>
    function calculate() {
      const a = parseFloat(document.getElementById("a").value);
      const b = parseFloat(document.getElementById("b").value);
      const c = parseFloat(document.getElementById("c").value);
      const result = document.getElementById("result");

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        result.innerHTML = "Please enter valid numbers.";
        return;
      }

      if (a === 0) {
        result.innerHTML = "Not a quadratic (a = 0).";
        return;
      }

      const D = b*b - 4*a*c;

      if (D > 0) {
        const x1 = (-b + Math.sqrt(D)) / (2*a);
        const x2 = (-b - Math.sqrt(D)) / (2*a);

        result.innerHTML = `
          \( D = ${D} \)<br>
          Two real roots:<br>
          \( x_1 = ${x1} \), \( x_2 = ${x2} \)
        `;
      } 
      else if (D === 0) {
        const x = -b / (2*a);

        result.innerHTML = `
          \( D = 0 \)<br>
          One repeated root:<br>
          \( x = ${x} \)
        `;
      } 
      else {
        const real = (-b/(2*a)).toFixed(4);
        const imag = (Math.sqrt(-D)/(2*a)).toFixed(4);

        result.innerHTML = `
          \( D = ${D} \)<br>
          Complex roots:<br>
          \( x_1 = ${real} + ${imag}i \)<br>
          \( x_2 = ${real} - ${imag}i \)
        `;
      }

      renderMathInElement(result);
    }
  </script>
</body>
</html>
