<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quadratic Roots Calculator</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px 0;
      text-align: center;
      font-size: 1.6rem;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 6px;
    }

    .equation {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.15rem;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      width: 42px;
      font-weight: bold;
    }

    input {
      flex: 1;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #bbb;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background: #2d6cdf;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1f57b8;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 6px;
      min-height: 140px;
    }

    .section-title {
      font-weight: bold;
      margin: 14px 0 8px 0;
    }

    .math-display {
      margin: 10px 0;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Quadratic Roots Calculator</h1>

    <div class="subtitle">
      This calculator solves the quadratic equation
    </div>

    <div class="equation" id="main-equation"></div>

    <div class="row">
      <label>a =</label>
      <input type="number" id="a" step="1" value="1">
    </div>

    <div class="row">
      <label>b =</label>
      <input type="number" id="b" step="1" value="0">
    </div>

    <div class="row">
      <label>c =</label>
      <input type="number" id="c" step="1" value="0">
    </div>

    <button onclick="calculateRoots()">Calculate Roots</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function render(id, tex) {
      katex.render(tex, document.getElementById(id), {
        throwOnError: false,
        displayMode: true
      });
    }

    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b !== 0) {
        [a, b] = [b, a % b];
      }
      return a || 1;
    }

    function simplifyFraction(n, d) {
      if (d < 0) { n = -n; d = -d; }
      const g = gcd(n, d);
      n /= g; d /= g;
      return d === 1 ? `${n}` : `\\frac{${n}}{${d}}`;
    }

    function integerSqrt(n) {
      const r = Math.round(Math.sqrt(n));
      return r * r === n ? r : null;
    }

    function simplifyRadical(n) {
      let out = 1, inside = n;
      for (let i = 2; i * i <= inside; i++) {
        while (inside % (i*i) === 0) {
          out *= i;
          inside /= i*i;
        }
      }
      return { out, inside };
    }

    function round2(x) {
      return (Math.round(x * 100) / 100).toFixed(2);
    }

    function calculateRoots() {
      const a = parseInt(aInput.value);
      const b = parseInt(bInput.value);
      const c = parseInt(cInput.value);
      const result = document.getElementById("result");

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        result.innerHTML = `<div class="error">Enter integer values.</div>`;
        return;
      }

      if (a === 0) {
        result.innerHTML = `<div class="error">Not quadratic (a = 0).</div>`;
        return;
      }

      const D = b*b - 4*a*c;

      result.innerHTML = `
        <div class="section-title">Exact form</div>
        <div id="e1" class="math-display"></div>
        <div id="e2" class="math-display"></div>

        <div class="section-title">Rounded</div>
        <div id="r1" class="math-display"></div>
        <div id="r2" class="math-display"></div>
      `;

      if (D >= 0) {
        const sqrtD = integerSqrt(D);

        if (sqrtD !== null) {
          render("e1", `x_1 = ${simplifyFraction(-b + sqrtD, 2*a)}`);
          render("e2", `x_2 = ${simplifyFraction(-b - sqrtD, 2*a)}`);
        } else {
          const { out, inside } = simplifyRadical(D);
          render("e1", `x_1 = \\frac{-${b} + ${out===1?"":out}\\sqrt{${inside}}}{${2*a}}`);
          render("e2", `x_2 = \\frac{-${b} - ${out===1?"":out}\\sqrt{${inside}}}{${2*a}}`);
        }

        const x1 = (-b + Math.sqrt(D))/(2*a);
        const x2 = (-b - Math.sqrt(D))/(2*a);

        render("r1", `x_1 \\approx ${round2(x1)}`);
        render("r2", `x_2 \\approx ${round2(x2)}`);

      } else {
        const { out, inside } = simplifyRadical(-D);
        render("e1", `x_1 = \\frac{-${b} + ${out===1?"":out}i\\sqrt{${inside}}}{${2*a}}`);
        render("e2", `x_2 = \\frac{-${b} - ${out===1?"":out}i\\sqrt{${inside}}}{${2*a}}`);

        const real = -b/(2*a);
        const imag = Math.sqrt(-D)/(2*a);

        render("r1", `x_1 \\approx ${round2(real)} + ${round2(imag)}i`);
        render("r2", `x_2 \\approx ${round2(real)} - ${round2(imag)}i`);
      }
    }

    render("main-equation", "ax^2 + bx + c = 0");
  </script>
</body>
</html>
