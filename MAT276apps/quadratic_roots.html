<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quadratic Roots Calculator</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px 0;
      text-align: center;
      font-size: 1.6rem;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 18px;
    }

    .equation {
      text-align: center;
      margin-bottom: 22px;
      font-size: 1.1rem;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      width: 42px;
      font-weight: bold;
    }

    input {
      flex: 1;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #bbb;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background: #2d6cdf;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1f57b8;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 6px;
      min-height: 140px;
    }

    .result-title {
      font-weight: bold;
      margin-bottom: 14px;
      font-size: 1.05rem;
    }

    .section-title {
      font-weight: bold;
      margin: 14px 0 8px 0;
    }

    .math-display {
      margin: 10px 0;
      overflow-x: auto;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Quadratic Roots Calculator</h1>
    <div class="subtitle">Enter values for <i>a, b,</i> and <i>c</i>in</div>
    <div class="equation" id="main-equation"></div>

    <div class="row">
      <label for="a">a =</label>
      <input type="number" id="a" step="1" value="1">
    </div>

    <div class="row">
      <label for="b">b =</label>
      <input type="number" id="b" step="1" value="0">
    </div>

    <div class="row">
      <label for="c">c =</label>
      <input type="number" id="c" step="1" value="0">
    </div>

    <button onclick="calculateRoots()">Calculate Roots</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function renderMathInElementById(id, tex, displayMode = false) {
      katex.render(tex, document.getElementById(id), {
        throwOnError: false,
        displayMode: displayMode
      });
    }

    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b !== 0) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a || 1;
    }

    function simplifyFraction(n, d) {
      if (d < 0) {
        n = -n;
        d = -d;
      }
      const g = gcd(n, d);
      n /= g;
      d /= g;
      if (d === 1) return `${n}`;
      if (n === 0) return `0`;
      return `\\frac{${n}}{${d}}`;
    }

    function integerSqrtIfPerfect(n) {
      if (n < 0) return null;
      const r = Math.round(Math.sqrt(n));
      return r * r === n ? r : null;
    }

    function simplifyRadical(n) {
      let outside = 1;
      let inside = n;
      for (let i = 2; i * i <= inside; i++) {
        while (inside % (i * i) === 0) {
          outside *= i;
          inside /= i * i;
        }
      }
      return { outside, inside };
    }

    function formatRounded(x) {
      const y = Math.round(x * 100) / 100;
      return y.toFixed(2);
    }

    function realExactTex(a, b, c) {
      const disc = b * b - 4 * a * c;
      const sqrtDisc = integerSqrtIfPerfect(disc);
      const denom = 2 * a;

      if (sqrtDisc !== null) {
        const x1 = simplifyFraction(-b + sqrtDisc, denom);
        const x2 = simplifyFraction(-b - sqrtDisc, denom);
        return [`x_1 = ${x1}`, `x_2 = ${x2}`];
      }

      const { outside, inside } = simplifyRadical(disc);
      let coeff = outside;
      let numConst = -b;
      let den = denom;

      const g = gcd(gcd(Math.abs(numConst), Math.abs(coeff)), Math.abs(den));
      if (g > 1) {
        numConst /= g;
        coeff /= g;
        den /= g;
      }

      const rootPart = coeff === 1 ? `\\sqrt{${inside}}` : `${coeff}\\sqrt{${inside}}`;

      return [
        `x_1 = \\frac{${numConst} + ${rootPart}}{${den}}`,
        `x_2 = \\frac{${numConst} - ${rootPart}}{${den}}`
      ];
    }

    function complexExactTex(a, b, c) {
      const disc = b * b - 4 * a * c;
      const posDisc = -disc;
      const sqrtDisc = integerSqrtIfPerfect(posDisc);
      const denom = 2 * a;

      if (sqrtDisc !== null) {
        const real = simplifyFraction(-b, denom);
        const imag = simplifyFraction(sqrtDisc, denom);
        return [
          `x_1 = ${real} + ${imag}i`,
          `x_2 = ${real} - ${imag}i`
        ];
      }

      const { outside, inside } = simplifyRadical(posDisc);
      let coeff = outside;
      let numConst = -b;
      let den = denom;

      const g = gcd(gcd(Math.abs(numConst), Math.abs(coeff)), Math.abs(den));
      if (g > 1) {
        numConst /= g;
        coeff /= g;
        den /= g;
      }

      const imagPart = coeff === 1 ? `i\\sqrt{${inside}}` : `${coeff}i\\sqrt{${inside}}`;

      return [
        `x_1 = \\frac{${numConst} + ${imagPart}}{${den}}`,
        `x_2 = \\frac{${numConst} - ${imagPart}}{${den}}`
      ];
    }

    function calculateRoots() {
      const a = parseInt(document.getElementById("a").value, 10);
      const b = parseInt(document.getElementById("b").value, 10);
      const c = parseInt(document.getElementById("c").value, 10);
      const result = document.getElementById("result");

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        result.innerHTML = `<div class="error">Please enter integer values for a, b, and c.</div>`;
        return;
      }

      if (a === 0) {
        result.innerHTML = `<div class="error">This is not a quadratic equation because a = 0.</div>`;
        return;
      }

      const disc = b * b - 4 * a * c;

      if (disc >= 0) {
        const x1 = (-b + Math.sqrt(disc)) / (2 * a);
        const x2 = (-b - Math.sqrt(disc)) / (2 * a);
        const exact = realExactTex(a, b, c);

        result.innerHTML = `
          <div class="result-title">Real roots</div>

          <div class="section-title">Exact form</div>
          <div class="math-display" id="exact1"></div>
          <div class="math-display" id="exact2"></div>

          <div class="section-title">Rounded to two decimals</div>
          <div class="math-display" id="approx1"></div>
          <div class="math-display" id="approx2"></div>
        `;

        katex.render(exact[0], document.getElementById("exact1"), { throwOnError: false, displayMode: true });
        katex.render(exact[1], document.getElementById("exact2"), { throwOnError: false, displayMode: true });
        katex.render(`x_1 \\approx ${formatRounded(x1)}`, document.getElementById("approx1"), { throwOnError: false, displayMode: true });
        katex.render(`x_2 \\approx ${formatRounded(x2)}`, document.getElementById("approx2"), { throwOnError: false, displayMode: true });
      } else {
        const realPart = -b / (2 * a);
        const imagPart = Math.sqrt(-disc) / (2 * a);
        const exact = complexExactTex(a, b, c);

        result.innerHTML = `
          <div class="result-title">Complex roots</div>

          <div class="section-title">Exact form</div>
          <div class="math-display" id="exact1"></div>
          <div class="math-display" id="exact2"></div>

          <div class="section-title">Rounded to two decimals</div>
          <div class="math-display" id="approx1"></div>
          <div class="math-display" id="approx2"></div>
        `;

        katex.render(exact[0], document.getElementById("exact1"), { throwOnError: false, displayMode: true });
        katex.render(exact[1], document.getElementById("exact2"), { throwOnError: false, displayMode: true });
        katex.render(`x_1 \\approx ${formatRounded(realPart)} + ${formatRounded(imagPart)}i`, document.getElementById("approx1"), { throwOnError: false, displayMode: true });
        katex.render(`x_2 \\approx ${formatRounded(realPart)} - ${formatRounded(imagPart)}i`, document.getElementById("approx2"), { throwOnError: false, displayMode: true });
      }
    }

    renderMathInElementById("main-equation", "ax^2 + bx + c = 0", true);
  </script>
</body>
</html>
