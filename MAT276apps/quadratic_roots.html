<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadratic Roots Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
    }

    p {
      margin-bottom: 20px;
      text-align: center;
    }

    .equation {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      width: 40px;
      font-weight: bold;
    }

    input {
      flex: 1;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #bbb;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background: #2d6cdf;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #1f57b8;
    }

    .result {
      margin-top: 20px;
      padding: 14px;
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 60px;
      white-space: pre-line;
    }

    .small {
      font-size: 0.95rem;
      color: #555;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Quadratic Roots Calculator</h1>
    <p>Enter values for <strong>a</strong>, <strong>b</strong>, and <strong>c</strong> in the quadratic equation.</p>

    <div class="equation">ax² + bx + c = 0</div>

    <div class="row">
      <label for="a">a =</label>
      <input type="number" id="a" step="any" value="1" />
    </div>

    <div class="row">
      <label for="b">b =</label>
      <input type="number" id="b" step="any" value="0" />
    </div>

    <div class="row">
      <label for="c">c =</label>
      <input type="number" id="c" step="any" value="0" />
    </div>

    <button onclick="calculateRoots()">Calculate Roots</button>

    <div class="result" id="result">Your results will appear here.</div>

    <div class="small">
      This calculator uses the quadratic formula:
      x = (-b ± √(b² - 4ac)) / (2a)
    </div>
  </div>

  <script>
    function calculateRoots() {
      const a = parseFloat(document.getElementById("a").value);
      const b = parseFloat(document.getElementById("b").value);
      const c = parseFloat(document.getElementById("c").value);
      const result = document.getElementById("result");

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        result.textContent = "Please enter valid numbers for a, b, and c.";
        return;
      }

      if (a === 0) {
        result.textContent = "This is not a quadratic equation because a = 0.";
        return;
      }

      const discriminant = b * b - 4 * a * c;

      if (discriminant > 0) {
        const root1 = (-b + Math.sqrt(discriminant)) / (2 * a);
        const root2 = (-b - Math.sqrt(discriminant)) / (2 * a);
        result.textContent =
          "Discriminant: " + discriminant + "\n" +
          "Two real roots:\n" +
          "x₁ = " + root1 + "\n" +
          "x₂ = " + root2;
      } else if (discriminant === 0) {
        const root = -b / (2 * a);
        result.textContent =
          "Discriminant: " + discriminant + "\n" +
          "One repeated real root:\n" +
          "x = " + root;
      } else {
        const realPart = (-b / (2 * a));
        const imaginaryPart = (Math.sqrt(-discriminant) / (2 * a));
        result.textContent =
          "Discriminant: " + discriminant + "\n" +
          "Two complex roots:\n" +
          "x₁ = " + realPart + " + " + imaginaryPart + "i\n" +
          "x₂ = " + realPart + " - " + imaginaryPart + "i";
      }
    }
  </script>
</body>
</html>
