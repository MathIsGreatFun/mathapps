<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equation Solution Finder</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #1f3b57;
    }

    .note {
      background: #eef5ff;
      border-left: 5px solid #2f70b7;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      line-height: 1.45;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 13px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1f5f9f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #184b7d;
    }

    #results {
      margin-top: 24px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      min-height: 80px;
      line-height: 1.5;
    }

    .section-title {
      font-weight: bold;
      margin-top: 6px;
      margin-bottom: 10px;
      color: #1f3b57;
      font-size: 19px;
    }

    .math-row {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      margin: 9px 0;
      overflow-x: auto;
      font-size: 18px;
    }

    .small {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }

    .error {
      color: #a00000;
      font-weight: bold;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Equation Solution Finder</h1>

    <div class="note">
      Enter the expression from one side of an equation that is equal to <code>0</code>.
      For example, to solve <code>3*x*(1 - x/3) - x*y = 0</code>, enter only
      <code>3*x*(1 - x/3) - x*y</code>. Use explicit multiplication, such as <code>2*x</code>, not <code>2x</code>.
    </div>

    <label for="expr">Expression equal to 0:</label>
    <input id="expr" value="3*x*(1 - x/3) - x*y" />

    <button onclick="solveEquation()">Solve Equation</button>

    <div id="results">Solutions will appear here.</div>
  </div>

  <script>
    function normalizeInput(s) {
      s = s.trim();

      if (s.includes("=")) {
        throw new Error("Enter only the expression on one side of the equation. Do not include = 0.");
      }

      if (s.length === 0) {
        throw new Error("Please enter an expression.");
      }

      return s;
    }

    function renderMath(element, latex) {
      if (typeof katex === "undefined") {
        element.textContent = latex;
        return;
      }

      katex.render(latex, element, {
        throwOnError: false,
        displayMode: true
      });
    }

    function addMathRow(parent, latex) {
      const row = document.createElement("div");
      row.className = "math-row";
      parent.appendChild(row);
      renderMath(row, latex);
    }

    function toLatex(expr) {
      try {
        return nerdamer(expr).toTeX();
      } catch (e) {
        return String(expr);
      }
    }

    function getVariables(expr) {
      const found = new Set();
      const matches = expr.match(/[a-zA-Z]+/g) || [];

      matches.forEach(v => {
        if (!["sqrt", "sin", "cos", "tan", "sec", "csc", "cot", "log", "ln", "exp", "pi", "e"].includes(v)) {
          found.add(v);
        }
      });

      return Array.from(found);
    }

    function nerdamerArrayToStrings(sol) {
      let arr = [];

      if (Array.isArray(sol)) {
        arr = sol;
      } else if (sol && typeof sol.each === "function") {
        sol.each(function(value) {
          arr.push(value);
        });
      } else if (sol) {
        arr = [sol];
      }

      return arr.map(v => String(v)).filter(v => v !== "");
    }

    function splitTopLevelFactors(factoredExpr) {
      let s = String(factoredExpr).trim();

      // Remove unnecessary outer parentheses around the entire expression.
      while (s.startsWith("(") && s.endsWith(")") && matchingOuterParens(s)) {
        s = s.slice(1, -1).trim();
      }

      const factors = [];
      let current = "";
      let depth = 0;

      for (let i = 0; i < s.length; i++) {
        const ch = s[i];

        if (ch === "(") depth++;
        if (ch === ")") depth--;

        if (ch === "*" && depth === 0) {
          if (current.trim()) factors.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }

      if (current.trim()) factors.push(current.trim());

      return factors.length ? factors : [s];
    }

    function matchingOuterParens(s) {
      let depth = 0;

      for (let i = 0; i < s.length; i++) {
        if (s[i] === "(") depth++;
        if (s[i] === ")") depth--;

        if (depth === 0 && i < s.length - 1) {
          return false;
        }
      }

      return depth === 0;
    }

    function stripNumericFactor(factor) {
      const f = factor.trim();

      if (/^-?\d+(\.\d+)?$/.test(f)) return null;
      if (/^-?\d+\/\d+$/.test(f)) return null;

      return f;
    }

    function solveFactor(factor) {
      const variables = getVariables(factor);
      const answers = [];

      if (variables.length === 0) return answers;

      // Prefer simple constant branches like x = 0.
      for (const v of variables) {
        try {
          const sol = nerdamer.solve(factor, v);
          const sols = nerdamerArrayToStrings(sol);

          sols.forEach(s => {
            if (s !== "" && s !== "[]" && s !== "undefined") {
              answers.push({
                variable: v,
                expression: s
              });
            }
          });
        } catch (e) {}
      }

      return answers;
    }

    function uniqueSolutions(solutions) {
      const seen = new Set();
      const output = [];

      solutions.forEach(sol => {
        const key = sol.variable + "=" + sol.expression;

        if (!seen.has(key)) {
          seen.add(key);
          output.push(sol);
        }
      });

      return output;
    }

    function solveEquation() {
      const results = document.getElementById("results");
      results.innerHTML = "";

      try {
        if (typeof nerdamer === "undefined") {
          throw new Error("The algebra engine did not load. Check that the CDN scripts are not being blocked.");
        }

        const expr = normalizeInput(document.getElementById("expr").value);
        nerdamer(expr);

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = "Solutions:";
        results.appendChild(title);

        const factored = String(nerdamer.factor(expr));
        const rawFactors = splitTopLevelFactors(factored);
        const factors = rawFactors.map(stripNumericFactor).filter(Boolean);

        let allSolutions = [];

        factors.forEach(factor => {
          allSolutions = allSolutions.concat(solveFactor(factor));
        });

        allSolutions = uniqueSolutions(allSolutions);

        if (allSolutions.length === 0) {
          addMathRow(results, "\\text{No explicit solution found by this app.}");
          return;
        }

        allSolutions.forEach(sol => {
          addMathRow(results, sol.variable + " = " + toLatex(sol.expression));
        });

      } catch (err) {
        results.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
