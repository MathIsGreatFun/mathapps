<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equation Solution Finder</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #1f3b57;
    }

    .note {
      background: #eef5ff;
      border-left: 5px solid #2f70b7;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      line-height: 1.45;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 13px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1f5f9f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #184b7d;
    }

    #results {
      margin-top: 24px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      min-height: 80px;
      line-height: 1.5;
    }

    .section-title {
      font-weight: bold;
      margin-top: 6px;
      margin-bottom: 10px;
      color: #1f3b57;
      font-size: 19px;
    }

    .math-row {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      margin: 9px 0;
      overflow-x: auto;
      font-size: 18px;
    }

    .small {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }

    .error {
      color: #a00000;
      font-weight: bold;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Equation Solution Finder</h1>

    <div class="note">
      Enter the expression from one side of an equation that is equal to <code>0</code>.
      For example, to solve <code>x^2 + y^2 - 25 = 0</code>, enter only
      <code>x^2 + y^2 - 25</code>. Use explicit multiplication, such as <code>2*x</code>, not <code>2x</code>.
    </div>

    <label for="expr">Expression equal to 0:</label>
    <input id="expr" value="x^2 + y^2 - 25" />

    <button onclick="solveEquation()">Solve Equation</button>

    <div id="results">Solutions will appear here.</div>
  </div>

  <script>
    function normalizeInput(s) {
      s = s.trim();

      if (s.includes("=")) {
        throw new Error("Enter only the expression on one side of the equation. Do not include = 0.");
      }

      if (s.length === 0) {
        throw new Error("Please enter an expression.");
      }

      return s;
    }

    function renderMath(element, latex) {
      if (typeof katex === "undefined") {
        element.textContent = latex;
        return;
      }

      katex.render(latex, element, {
        throwOnError: false,
        displayMode: true
      });
    }

    function addMathRow(parent, latex) {
      const row = document.createElement("div");
      row.className = "math-row";
      parent.appendChild(row);
      renderMath(row, latex);
    }

    function toLatex(expr) {
      try {
        return nerdamer(expr).toTeX();
      } catch (e) {
        return String(expr);
      }
    }

    function getVariables(expr) {
      const found = new Set();
      const matches = expr.match(/[a-zA-Z]+/g) || [];

      matches.forEach(v => {
        if (!["sqrt", "sin", "cos", "tan", "sec", "csc", "cot", "log", "ln", "exp", "pi", "e"].includes(v)) {
          found.add(v);
        }
      });

      return Array.from(found);
    }

    function nerdamerArrayToStrings(sol) {
      let arr = [];

      if (Array.isArray(sol)) {
        arr = sol;
      } else if (sol && typeof sol.each === "function") {
        sol.each(function(value) {
          arr.push(value);
        });
      } else if (sol) {
        arr = [sol];
      }

      return arr.map(v => String(v)).filter(v => v !== "");
    }

    function solveForVariable(expr, variable) {
      try {
        const sol = nerdamer.solve(expr, variable);
        return nerdamerArrayToStrings(sol);
      } catch (e) {
        return [];
      }
    }

    function chooseSolutionVariable(expr) {
      const variables = getVariables(expr);

      if (variables.length === 0) return null;

      if (variables.includes("y")) return "y";
      if (variables.includes("x")) return "x";

      return variables[0];
    }

    function solveEquation() {
      const results = document.getElementById("results");
      results.innerHTML = "";

      try {
        if (typeof nerdamer === "undefined") {
          throw new Error("The algebra engine did not load. Check that the CDN scripts are not being blocked.");
        }

        const expr = normalizeInput(document.getElementById("expr").value);

        nerdamer(expr);

        const variable = chooseSolutionVariable(expr);

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = "Solutions:";
        results.appendChild(title);

        if (variable === null) {
          const value = Number(nerdamer(expr).evaluate().text());
          if (Math.abs(value) < 1e-12) {
            addMathRow(results, "\\text{All real ordered pairs }(x,y)\\text{ satisfy the equation.}");
          } else {
            addMathRow(results, "\\varnothing");
          }
          return;
        }

        const solutions = solveForVariable(expr, variable);

        if (solutions.length === 0) {
          addMathRow(results, "\\text{No explicit solution found by this app.}");
          const note = document.createElement("div");
          note.className = "small";
          note.textContent = "The app does not display implicit solutions, since the original equation already gives that form.";
          results.appendChild(note);
          return;
        }

        solutions.forEach(sol => {
          addMathRow(results, variable + " = " + toLatex(sol));
        });

      } catch (err) {
        results.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
