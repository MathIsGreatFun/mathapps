<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root Finder</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #1f3b57;
    }

    .note {
      background: #eef5ff;
      border-left: 5px solid #2f70b7;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      line-height: 1.45;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 13px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1f5f9f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #184b7d;
    }

    #results {
      margin-top: 24px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .section-title {
      font-weight: bold;
      color: #1f3b57;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .math-row {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      margin: 10px 0;
      overflow-x: auto;
    }

    .small {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }

    .error {
      color: #a00000;
      font-weight: bold;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Root Finder</h1>

    <div class="note">
      Enter only the expression equal to <code>0</code>. Use explicit multiplication, such as
      <code>2*x</code>, not <code>2x</code>.
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin-top:16px;">
  <label for="expr" style="margin:0; font-size:28px; font-weight:bold;">
    0 =
  </label>

  <input
    id="expr"
    maxlength="30"
    style="
      width: 320px;
      font-size: 18px;
      padding: 10px;
    "
    value="2*(1-x/2)-x*y"
  />
</div>

    <button onclick="solveEquation()">Solve Equation</button>

    <div id="results">Solutions will appear here.</div>
  </div>

  <script>
    function normalizeInput(s) {
      s = s.trim();

      if (s.includes("=")) {
        throw new Error("Enter only the expression on one side. Do not include = 0.");
      }

      if (s.length === 0) {
        throw new Error("Please enter an expression.");
      }

      return s;
    }

    function renderMath(element, latex) {
      if (typeof katex === "undefined") {
        element.textContent = latex;
        return;
      }

      katex.render(latex, element, {
        throwOnError: false,
        displayMode: true
      });
    }

    function addMathRow(parent, latex) {
      const row = document.createElement("div");
      row.className = "math-row";
      parent.appendChild(row);
      renderMath(row, latex);
    }

    function toLatex(expr) {
      try {
        return nerdamer(expr).toTeX();
      } catch (e) {
        return String(expr);
      }
    }

    function nerdamerArrayToStrings(sol) {
      let arr = [];

      if (Array.isArray(sol)) {
        arr = sol;
      }
      else if (sol && typeof sol.each === "function") {
        sol.each(v => arr.push(v));
      }
      else if (sol) {
        arr = [sol];
      }

      return arr.map(v => String(v)).filter(v => v !== "");
    }

    function simplifyText(expr) {
      try {
        return String(nerdamer(expr).expand().simplify());
      } catch (e) {
        return String(expr);
      }
    }

    function isZeroExpression(expr) {
      try {
        const s = String(nerdamer(expr).expand().simplify());
        return s === "0";
      } catch (e) {
        return false;
      }
    }

    function solveFor(expr, variable) {
      try {
        return nerdamerArrayToStrings(nerdamer.solve(expr, variable));
      } catch (e) {
        return [];
      }
    }

    function getCandidateConstantBranches(expr, variable) {
      const candidates = solveFor(expr, variable);
      const output = [];

      candidates.forEach(c => {
        if (c.includes("x") || c.includes("y")) return;

        const substituted = expr.replaceAll(variable, "(" + c + ")");

        if (isZeroExpression(substituted)) {
          output.push({
            variable: variable,
            expression: c
          });
        }
      });

      return output;
    }

    function hasVariable(expr, variable) {
      const regex = new RegExp("(^|[^a-zA-Z])" + variable + "([^a-zA-Z]|$)");
      return regex.test(expr);
    }

    function uniqueByLatex(solutions) {
      const seen = new Set();
      const output = [];

      solutions.forEach(sol => {
        const key = sol.variable + "=" + simplifyText(sol.expression);

        if (!seen.has(key)) {
          seen.add(key);
          output.push(sol);
        }
      });

      return output;
    }

    function solveEquation() {
      const results = document.getElementById("results");
      results.innerHTML = "";

      try {
        if (typeof nerdamer === "undefined") {
          throw new Error("The algebra engine did not load. Check whether CDN scripts are blocked.");
        }

        const expr = normalizeInput(document.getElementById("expr").value);
        nerdamer(expr);

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = "Solutions:";
        results.appendChild(title);

        let solutions = [];

        // Verified special branches only.
        solutions = solutions.concat(getCandidateConstantBranches(expr, "x"));
        solutions = solutions.concat(getCandidateConstantBranches(expr, "y"));

        // Main explicit solution form.
        if (hasVariable(expr, "y")) {
          const ySolutions = solveFor(expr, "y");

          ySolutions.forEach(s => {
            solutions.push({
              variable: "y",
              expression: s
            });
          });
        }
        else if (hasVariable(expr, "x")) {
          const xSolutions = solveFor(expr, "x");

          xSolutions.forEach(s => {
            solutions.push({
              variable: "x",
              expression: s
            });
          });
        }

        solutions = uniqueByLatex(solutions);

        if (solutions.length === 0) {
          addMathRow(results, "\\text{No explicit solution found.}");
          return;
        }

        solutions.forEach(sol => {
          addMathRow(results, sol.variable + "=" + toLatex(sol.expression));
        });

        const note = document.createElement("div");
        note.className = "small";
        note.textContent = "Special branches are only displayed after substitution verifies that they satisfy the original equation.";
        results.appendChild(note);

      } catch (err) {
        results.innerHTML = '<div class="error">Error: ' + err.message + '</div>';
      }
    }
  </script>
</body>
</html>
