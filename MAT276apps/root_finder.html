<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root Finder</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <script defer
          src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
  </script>

  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #1f3b57;
    }

    .note {
      background: #eef5ff;
      border-left: 5px solid #2f70b7;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      line-height: 1.45;
    }

    input {
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 13px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1f5f9f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #184b7d;
    }

    #results {
      margin-top: 24px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .section-title {
      font-weight: bold;
      color: #1f3b57;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .math-row {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      margin: 10px 0;
      overflow-x: auto;
    }

    .error {
      color: #a00000;
      font-weight: bold;
      line-height: 1.5;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Root Finder</h1>

  <div class="note">
    Enter only the expression equal to <code>0</code>.
    Use explicit multiplication, such as
    <code>2*x</code>, not <code>2x</code>.
  </div>

  <div style="display:flex; align-items:center; gap:10px; margin-top:16px;">

    <label for="expr"
           style="margin:0; font-size:28px; font-weight:bold;">
      0 =
    </label>

    <input
      id="expr"
      maxlength="30"
      style="
        width:320px;
        font-size:18px;
        padding:10px;
      "
      value="2*x*(1-x/2)-x*y"
    />

  </div>

  <button onclick="solveEquation()">
    Solve Equation
  </button>

  <div id="results">
    Solutions will appear here.
  </div>

</div>


<script>

  /* =========================================================
     INPUT VALIDATION
     ========================================================= */

  function normalizeInput(s) {

    s = s.trim();

    if (s.length === 0) {
      throw new Error("Please enter an expression.");
    }

    if (s.includes("=")) {
      throw new Error(
        "Enter only the expression on one side. Do not include = 0."
      );
    }

    /*
       Catch implicit multiplication BEFORE Nerdamer receives
       the expression.

       Examples:
         2x
         3y
         xy
         x(y+1)
         2(x+1)
         (x+1)y
         (x+1)(y-1)
    */

    const badPatterns = [
      /\d\s*[xy(]/i,
      /[xy]\s*[xy]/i,
      /[xy]\s*\(/i,
      /\)\s*[xy]/i,
      /\)\s*\(/,
      /\)\s*\d/
    ];

    for (const pattern of badPatterns) {

      if (pattern.test(s)) {

        throw new Error(
          "Please use * for multiplication. " +
          "For example: 2*x instead of 2x, " +
          "x*y instead of xy, and x*(y+1) instead of x(y+1)."
        );

      }

    }

    return s;
  }


  /* =========================================================
     DISPLAY
     ========================================================= */

  function renderMath(element, latex) {

    if (typeof katex === "undefined") {
      element.textContent = latex;
      return;
    }

    katex.render(latex, element, {
      throwOnError: false,
      displayMode: true
    });
  }


  function addMathRow(parent, latex) {

    const row = document.createElement("div");

    row.className = "math-row";

    parent.appendChild(row);

    renderMath(row, latex);
  }


  function toLatex(expr) {

    try {
      return nerdamer(expr).toTeX();
    }
    catch (e) {
      return String(expr);
    }
  }


  /* =========================================================
     NERDAMER HELPERS
     ========================================================= */

  function nerdamerArrayToStrings(sol) {

    let arr = [];

    if (Array.isArray(sol)) {

      arr = sol;

    }
    else if (sol && typeof sol.each === "function") {

      sol.each(v => arr.push(v));

    }
    else if (sol) {

      arr = [sol];

    }

    return arr
      .map(v => String(v))
      .filter(v => v !== "");
  }


  function solveFor(expr, variable) {

    try {

      return nerdamerArrayToStrings(
        nerdamer.solve(expr, variable)
      );

    }
    catch (e) {

      return [];

    }
  }


  function simplifyText(expr) {

    try {

      return String(
        nerdamer(expr)
          .expand()
          .simplify()
      );

    }
    catch (e) {

      return String(expr);

    }
  }


  function hasVariable(expr, variable) {

    try {

      return nerdamer(expr)
        .variables()
        .includes(variable);

    }
    catch (e) {

      return false;

    }
  }


  function containsXY(expr) {

    try {

      const vars = nerdamer(expr).variables();

      return vars.includes("x") || vars.includes("y");

    }
    catch (e) {

      return true;

    }
  }


  /* =========================================================
     VERIFY A PROPOSED SOLUTION
     =========================================================

     This is the important fix.

     Nerdamer is allowed to PROPOSE a solution, but we do not
     display it until substituting it back into the original
     equation produces exactly zero.

     Example:

       Original:
         2*x*(1-x/2)-x*y

       Proposed:
         y = 0

       Substitute:
         2*x*(1-x/2)-x*0

       Simplifies to:
         2*x-x^2

       That is NOT identically zero, so y = 0 is rejected.
     ========================================================= */

  function verifySolution(expr, variable, solution) {

    try {

      let substituted;

      /*
         Nerdamer's substitution object is much safer than
         manually replacing text inside the expression.
      */

      if (variable === "x") {

        substituted = nerdamer(
          expr,
          { x: "(" + solution + ")" }
        );

      }
      else {

        substituted = nerdamer(
          expr,
          { y: "(" + solution + ")" }
        );

      }

      const simplified = String(
        substituted
          .expand()
          .simplify()
      );

      return simplified === "0";

    }
    catch (e) {

      return false;

    }
  }


  /* =========================================================
     ADD ONLY VERIFIED SOLUTIONS
     ========================================================= */

  function addVerifiedSolution(
    solutions,
    expr,
    variable,
    candidate
  ) {

    if (
      verifySolution(
        expr,
        variable,
        candidate
      )
    ) {

      solutions.push({
        variable: variable,
        expression: simplifyText(candidate)
      });

    }
  }


  /* =========================================================
     REMOVE DUPLICATES
     ========================================================= */

  function uniqueSolutions(solutions) {

    const seen = new Set();

    const output = [];

    solutions.forEach(sol => {

      const key =
        sol.variable +
        "=" +
        simplifyText(sol.expression);

      if (!seen.has(key)) {

        seen.add(key);

        output.push(sol);

      }

    });

    return output;
  }


  /* =========================================================
     MAIN SOLVER
     ========================================================= */

  function solveEquation() {

    const results =
      document.getElementById("results");

    results.innerHTML = "";

    try {

      if (typeof nerdamer === "undefined") {

        throw new Error(
          "The algebra engine did not load. Check whether CDN scripts are blocked."
        );

      }


      /*
         Validation happens BEFORE Nerdamer is asked to solve.

         Therefore an entry such as 2x or xy receives an
         immediate useful error instead of appearing to hang.
      */

      const expr =
        normalizeInput(
          document.getElementById("expr").value
        );


      /*
         Make sure the expression itself is valid.
      */

      nerdamer(expr);


      const title =
        document.createElement("div");

      title.className = "section-title";

      title.textContent = "Solutions:";

      results.appendChild(title);


      let solutions = [];


      const hasX = hasVariable(expr, "x");
      const hasY = hasVariable(expr, "y");


      /* =====================================================
         TWO-VARIABLE EQUATION
         ===================================================== */

      if (hasX && hasY) {

        /*
           First solve for x.

           We only use CONSTANT x-solutions here.

           For example Nerdamer may return:

             x = 0
             x = 2-y

           x = 0 is the special branch we want.

           x = 2-y is simply the same main curve expressed
           another way, so we do not show it in addition to
           y = 2-x.
        */

        const xSolutions =
          solveFor(expr, "x");


        xSolutions.forEach(candidate => {

          if (!containsXY(candidate)) {

            addVerifiedSolution(
              solutions,
              expr,
              "x",
              candidate
            );

          }

        });


        /*
           Now solve for y.

           EVERY proposed y solution is substituted back into
           the original equation before being displayed.
        */

        const ySolutions =
          solveFor(expr, "y");


        ySolutions.forEach(candidate => {

          addVerifiedSolution(
            solutions,
            expr,
            "y",
            candidate
          );

        });

      }


      /* =====================================================
         X-ONLY EQUATION
         ===================================================== */

      else if (hasX) {

        const xSolutions =
          solveFor(expr, "x");


        xSolutions.forEach(candidate => {

          addVerifiedSolution(
            solutions,
            expr,
            "x",
            candidate
          );

        });

      }


      /* =====================================================
         Y-ONLY EQUATION
         ===================================================== */

      else if (hasY) {

        const ySolutions =
          solveFor(expr, "y");


        ySolutions.forEach(candidate => {

          addVerifiedSolution(
            solutions,
            expr,
            "y",
            candidate
          );

        });

      }


      else {

        throw new Error(
          "The expression must contain x or y."
        );

      }


      solutions =
        uniqueSolutions(solutions);


      if (solutions.length === 0) {

        addMathRow(
          results,
          "\\text{No explicit solution found.}"
        );

        return;
      }


      solutions.forEach(sol => {

        addMathRow(
          results,
          sol.variable +
          "=" +
          toLatex(sol.expression)
        );

      });

    }

    catch (err) {

      results.innerHTML =
        '<div class="error">Error: ' +
        err.message +
        '</div>';

    }

  }


  /* =========================================================
     ENTER KEY
     ========================================================= */

  document
    .getElementById("expr")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          solveEquation();

        }

      }
    );

</script>

</body>
</html>
