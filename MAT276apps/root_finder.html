<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single Equation Solution Form Finder</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #1f3b57;
    }

    .note {
      background: #eef5ff;
      border-left: 5px solid #2f70b7;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      line-height: 1.45;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 13px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1f5f9f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #184b7d;
    }

    #results {
      margin-top: 24px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      min-height: 80px;
      line-height: 1.5;
    }

    .section-title {
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #1f3b57;
      font-size: 18px;
    }

    .math-row {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin: 8px 0;
      overflow-x: auto;
      font-size: 18px;
    }

    .small {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }

    .error {
      color: #a00000;
      font-weight: bold;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Solution Form Finder for One Equation</h1>

    <div class="note">
      Enter the expression from one side of an equation that is equal to <code>0</code>.
      For example, to solve <code>x^2 + y^2 - 25 = 0</code>, enter only
      <code>x^2 + y^2 - 25</code>. Use explicit multiplication, such as <code>2*x</code>, not <code>2x</code>.
    </div>

    <label for="expr">Expression equal to 0:</label>
    <input id="expr" value="x^2 + y^2 - 25" />

    <button onclick="solveEquation()">Find Solution Equations</button>

    <div id="results">Results will appear here.</div>
  </div>

  <script>
    function normalizeInput(s) {
      s = s.trim();

      if (s.includes("=")) {
        throw new Error("Please enter only the expression on one side of the equation, not the equals sign.");
      }

      if (s.length === 0) {
        throw new Error("Please enter an expression.");
      }

      return s;
    }

    function addTextRow(parent, text) {
      const row = document.createElement("div");
      row.className = "math-row";
      row.textContent = text;
      parent.appendChild(row);
    }

    function cleanExpression(s) {
      return String(s)
        .replace(/\*/g, "")
        .replace(/\+\-/g, "-")
        .replace(/\-\-/g, "+");
    }

    function isQuadraticInY(expr) {
      const node = math.parse(expr);
      const simplified = math.simplify(node).toString();

      const samples = [
        {x: -3, y: 0},
        {x: -1, y: 0},
        {x: 2, y: 0}
      ];

      for (const scope of samples) {
        const a = coefficientY2(simplified, scope.x);
        const b = coefficientY(simplified, scope.x);
        const c = constantTermY(simplified, scope.x);
        const rebuilt = a*scope.y*scope.y + b*scope.y + c;
        const actual = math.evaluate(simplified, scope);
        if (!Number.isFinite(actual) || Math.abs(rebuilt - actual) > 1e-7) {
          return false;
        }
      }

      return true;
    }

    function coefficientY2(expr, xValue) {
      const f0 = math.evaluate(expr, {x: xValue, y: 0});
      const f1 = math.evaluate(expr, {x: xValue, y: 1});
      const f2 = math.evaluate(expr, {x: xValue, y: 2});
      return (f2 - 2*f1 + f0) / 2;
    }

    function coefficientY(expr, xValue) {
      const f0 = math.evaluate(expr, {x: xValue, y: 0});
      const f1 = math.evaluate(expr, {x: xValue, y: 1});
      const f2 = math.evaluate(expr, {x: xValue, y: 2});
      return (-f2 + 4*f1 - 3*f0) / 2;
    }

    function constantTermY(expr, xValue) {
      return math.evaluate(expr, {x: xValue, y: 0});
    }

    function solveSimpleForY(expr) {
      const s = math.simplify(expr).toString();

      // Common pattern: y - something
      try {
        const test = math.simplify("(" + s + ") - y").toString();
        if (!test.includes("y")) {
          return [cleanExpression("-(" + test + ")")];
        }
      } catch (e) {}

      // Common pattern: y + something
      try {
        const test = math.simplify("(" + s + ") + y").toString();
        if (!test.includes("y")) {
          return [cleanExpression("(" + test + ")")];
        }
      } catch (e) {}

      // Basic circle/ellipse-style pattern:
      // If expression has y^2 but no y term, solve y = ±sqrt(-constant part / coefficient of y^2).
      try {
        const withoutY2 = math.simplify(s.replace(/y\s*\^\s*2/g, "0")).toString();
        const coeffTest = math.simplify("(" + s + ") - (" + withoutY2 + ")").toString();

        if (!withoutY2.includes("y") && coeffTest.includes("y ^ 2") && !coeffTest.replace(/y\s\^\s2/g, "").includes("y")) {
          let coeff = coeffTest.replace(/\*?\s*y\s\^\s2/g, "").trim();
          if (coeff === "") coeff = "1";
          if (coeff === "-") coeff = "-1";

          const inside = math.simplify("-(" + withoutY2 + ")/(" + coeff + ")").toString();
          return [
            cleanExpression("sqrt(" + inside + ")"),
            cleanExpression("-sqrt(" + inside + ")")
          ];
        }
      } catch (e) {}

      return [];
    }

    function solveSimpleForX(expr) {
      const swapped = expr
        .replaceAll("x", "__TEMP__")
        .replaceAll("y", "x")
        .replaceAll("__TEMP__", "y");

      const yForms = solveSimpleForY(swapped);

      return yForms.map(s =>
        s.replaceAll("x", "__TEMP__")
         .replaceAll("y", "x")
         .replaceAll("__TEMP__", "y")
      );
    }

    function solveEquation() {
      const results = document.getElementById("results");
      results.innerHTML = "";

      try {
        if (typeof math === "undefined") {
          throw new Error("Math.js did not load. Check your internet connection or CDN access.");
        }

        const expr = normalizeInput(document.getElementById("expr").value);

        // Validate expression.
        math.parse(expr);

        const inputTitle = document.createElement("div");
        inputTitle.className = "section-title";
        inputTitle.textContent = "Equation entered:";
        results.appendChild(inputTitle);

        addTextRow(results, cleanExpression(expr) + " = 0");

        const ySolutions = solveSimpleForY(expr);
        const xSolutions = solveSimpleForX(expr);

        const yTitle = document.createElement("div");
        yTitle.className = "section-title";
        yTitle.textContent = "Solved for y:";
        results.appendChild(yTitle);

        if (ySolutions.length === 0) {
          addTextRow(results, "No explicit y-form solution was found.");
        } else {
          ySolutions.forEach(sol => addTextRow(results, "y = " + cleanExpression(sol)));
        }

        const xTitle = document.createElement("div");
        xTitle.className = "section-title";
        xTitle.textContent = "Solved for x:";
        results.appendChild(xTitle);

        if (xSolutions.length === 0) {
          addTextRow(results, "No explicit x-form solution was found.");
        } else {
          xSolutions.forEach(sol => addTextRow(results, "x = " + cleanExpression(sol)));
        }

        const implicitTitle = document.createElement("div");
        implicitTitle.className = "section-title";
        implicitTitle.textContent = "Implicit solution form:";
        results.appendChild(implicitTitle);

        addTextRow(results, cleanExpression(expr) + " = 0");

        const note = document.createElement("div");
        note.className = "small";
        note.innerHTML = `
          This version avoids the broken Nerdamer dependency. It handles many common classroom forms,
          especially equations that can be solved directly for one variable or circle-style equations.
          Very complicated nonlinear equations may remain in implicit form.
        `;
        results.appendChild(note);

      } catch (err) {
        results.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
