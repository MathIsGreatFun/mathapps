<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equation Solution Finder</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #1f3b57;
    }

    .note {
      background: #eef5ff;
      border-left: 5px solid #2f70b7;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      line-height: 1.45;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 13px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1f5f9f;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #184b7d;
    }

    #results {
      margin-top: 24px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .math-row {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      margin: 10px 0;
      overflow-x: auto;
    }

    .error {
      color: #a00000;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Equation Solution Finder</h1>

    <div class="note">
      Enter only the expression equal to <code>0</code>. Use explicit multiplication such as
      <code>2*x</code>, not <code>2x</code>.
    </div>

    <label for="expr">Expression equal to 0:</label>
    <input id="expr" value="3*x*(1 - x/3) - x*y" />

    <button onclick="solveEquation()">Solve Equation</button>

    <div id="results">Solutions will appear here.</div>
  </div>

  <script>
    function renderMath(element, latex) {
      katex.render(latex, element, {
        throwOnError: false,
        displayMode: true
      });
    }

    function addMathRow(parent, latex) {
      const row = document.createElement("div");
      row.className = "math-row";
      renderMath(row, latex);
      parent.appendChild(row);
    }

    function toLatex(expr) {
      return nerdamer(expr).toTeX();
    }

    function normalizeInput(s) {
      s = s.trim();

      if (s.includes("=")) {
        throw new Error("Do not include the equals sign.");
      }

      if (s.length === 0) {
        throw new Error("Please enter an expression.");
      }

      return s;
    }

    function getVariables(expr) {
      const matches = expr.match(/[a-zA-Z]+/g) || [];
      const bad = ["sqrt","sin","cos","tan","log","ln","exp","pi","e"];

      return [...new Set(matches.filter(v => !bad.includes(v)))];
    }

    function nerdamerArrayToStrings(sol) {
      let arr = [];

      if (Array.isArray(sol)) {
        arr = sol;
      }
      else if (sol && typeof sol.each === "function") {
        sol.each(v => arr.push(v));
      }
      else if (sol) {
        arr = [sol];
      }

      return arr.map(v => String(v)).filter(v => v !== "");
    }

    function matchingOuterParens(s) {
      let depth = 0;

      for (let i = 0; i < s.length; i++) {
        if (s[i] === "(") depth++;
        if (s[i] === ")") depth--;

        if (depth === 0 && i < s.length - 1) {
          return false;
        }
      }

      return true;
    }

    function splitTopLevelFactors(expr) {
      let s = expr.trim();

      while (s.startsWith("(") && s.endsWith(")") && matchingOuterParens(s)) {
        s = s.slice(1, -1).trim();
      }

      let depth = 0;
      let current = "";
      const factors = [];

      for (let i = 0; i < s.length; i++) {
        const ch = s[i];

        if (ch === "(") depth++;
        if (ch === ")") depth--;

        if (ch === "*" && depth === 0) {
          if (current.trim()) factors.push(current.trim());
          current = "";
        }
        else {
          current += ch;
        }
      }

      if (current.trim()) factors.push(current.trim());

      return factors;
    }

    function stripNumericFactor(factor) {
      if (/^-?\d+(\.\d+)?$/.test(factor)) return null;
      return factor;
    }

    function complexity(expr) {
      return expr.length;
    }

    function solveFactor(factor) {
      const vars = getVariables(factor);

      if (vars.length === 0) return [];

      const preferred = vars.includes("y") ? "y" : vars[0];

      try {
        const sols = nerdamerArrayToStrings(
          nerdamer.solve(factor, preferred)
        );

        return sols.map(s => ({
          variable: preferred,
          expression: s
        }));
      }
      catch (e) {
        return [];
      }
    }

    function uniqueSolutions(solutions) {
      const seen = new Set();
      const output = [];

      solutions.forEach(sol => {
        const key = sol.variable + "=" + sol.expression;

        if (!seen.has(key)) {
          seen.add(key);
          output.push(sol);
        }
      });

      return output;
    }

    function solveEquation() {
      const results = document.getElementById("results");
      results.innerHTML = "";

      try {
        const expr = normalizeInput(
          document.getElementById("expr").value
        );

        nerdamer(expr);

        const factored = String(nerdamer.factor(expr));

        const factors = splitTopLevelFactors(factored)
          .map(stripNumericFactor)
          .filter(Boolean);

        let solutions = [];

        factors.forEach(f => {
          solutions = solutions.concat(solveFactor(f));
        });

        solutions = uniqueSolutions(solutions);

        if (solutions.length === 0) {
          addMathRow(results, "\\text{No explicit solution found.}");
          return;
        }

        solutions.forEach(sol => {
          addMathRow(
            results,
            sol.variable + "=" + toLatex(sol.expression)
          );
        });

      }
      catch (err) {
        results.innerHTML =
          '<div class="error">Error: ' + err.message + '</div>';
      }
    }
  </script>
</body>
</html>
