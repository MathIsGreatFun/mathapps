<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Solver</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .card {
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .subtitle {
      text-align: center;
      color: #4b5563;
      margin: 0 auto 28px;
      max-width: 700px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .input-grid {
      display: grid;
      gap: 18px;
      margin-bottom: 24px;
    }

    .function-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      align-items: center;
      gap: 16px;
    }

    .math-label {
      text-align: right;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.45rem;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 12px 0 28px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-size: 1rem;
      cursor: pointer;
    }

    .primary { background: #2563eb; color: white; }
    .primary:hover { background: #1d4ed8; }
    .secondary { background: #e5e7eb; color: #111827; }
    .secondary:hover { background: #d1d5db; }

    .results-wrap {
      border-top: 1px solid #d1d5db;
      padding-top: 24px;
    }

    h2 {
      text-align: center;
      margin: 0 0 16px;
      font-size: 1.35rem;
    }

    #results {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 14px;
      padding: 20px;
      min-height: 72px;
      text-align: center;
      overflow-x: auto;
    }

    .solution-line {
      margin: 12px 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.25rem;
    }

    .error {
      color: #b91c1c;
      font-weight: 600;
      text-align: center;
    }

    @media (max-width: 650px) {
      .function-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .math-label {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>System Solver</h1>
      <p class="subtitle">
        Enter two functions of <i>x</i> and <i>y</i>. The app finds approximate points where both functions are equal to 0.
      </p>

      <div class="input-grid">
        <div class="function-row">
          <div class="math-label">0 =</div>
          <input id="fInput" type="text" value="x^2 + y^2 - 1" autocomplete="off" />
        </div>

        <div class="function-row">
          <div class="math-label">0 =</div>
          <input id="gInput" type="text" value="x - y" autocomplete="off" />
        </div>
      </div>

      <div class="buttons">
        <button class="primary" onclick="solveSystem()">Calculate</button>
        <button class="secondary" onclick="clearAll()">Clear</button>
      </div>

      <div class="results-wrap">
        <h2>Results</h2>
        <div id="results"></div>
      </div>
    </section>
  </main>

  <script>
    function normalizeInput(expression) {
      return expression.replaceAll("ln(", "log(").replaceAll("π", "pi");
    }

    function formatNumber(value) {
      if (Math.abs(value) < 0.00000000005) value = 0;
      return Number(value).toFixed(6).replace(/\.?0+$/, "");
    }

    function safeEvaluate(compiled, x, y) {
      const value = compiled.evaluate({ x: x, y: y });
      return typeof value === "number" && Number.isFinite(value) ? value : NaN;
    }

    function newtonSolve(fCompiled, gCompiled, startX, startY) {
      let x = startX;
      let y = startY;
      const tolerance = 0.0000000001;
      const maxIterations = 60;

      for (let k = 0; k < maxIterations; k++) {
        const fVal = safeEvaluate(fCompiled, x, y);
        const gVal = safeEvaluate(gCompiled, x, y);
        if (!Number.isFinite(fVal) || !Number.isFinite(gVal)) return null;
        if (Math.hypot(fVal, gVal) < tolerance) return { x: x, y: y };

        const h = 0.00001 * Math.max(1, Math.abs(x), Math.abs(y));
        const fx = (safeEvaluate(fCompiled, x + h, y) - safeEvaluate(fCompiled, x - h, y)) / (2 * h);
        const fy = (safeEvaluate(fCompiled, x, y + h) - safeEvaluate(fCompiled, x, y - h)) / (2 * h);
        const gx = (safeEvaluate(gCompiled, x + h, y) - safeEvaluate(gCompiled, x - h, y)) / (2 * h);
        const gy = (safeEvaluate(gCompiled, x, y + h) - safeEvaluate(gCompiled, x, y - h)) / (2 * h);

        const determinant = fx * gy - fy * gx;
        if (!Number.isFinite(determinant) || Math.abs(determinant) < 0.000000000001) return null;

        const dx = (-fVal * gy + fy * gVal) / determinant;
        const dy = (-fx * gVal + fVal * gx) / determinant;
        if (!Number.isFinite(dx) || !Number.isFinite(dy)) return null;

        x += dx;
        y += dy;
      }

      const finalF = safeEvaluate(fCompiled, x, y);
      const finalG = safeEvaluate(gCompiled, x, y);
      return Math.hypot(finalF, finalG) < 0.0000001 ? { x: x, y: y } : null;
    }

    function isDuplicate(solution, solutions) {
      return solutions.some(existing => Math.hypot(existing.x - solution.x, existing.y - solution.y) < 0.00001);
    }

    function solveSystem() {
      const results = document.getElementById("results");
      results.innerHTML = "";

      let fCompiled;
      let gCompiled;

      try {
        fCompiled = math.compile(normalizeInput(document.getElementById("fInput").value.trim()));
        gCompiled = math.compile(normalizeInput(document.getElementById("gInput").value.trim()));
      } catch (error) {
        results.innerHTML = '<div class="error">Unable to parse one or both functions.</div>';
        return;
      }

      const xMin = -50;
      const xMax = 50;
      const yMin = -50;
      const yMax = 50;
      const gridSize = 40;
      const solutions = [];

      for (let i = 0; i <= gridSize; i++) {
        const startX = xMin + (xMax - xMin) * i / gridSize;
        for (let j = 0; j <= gridSize; j++) {
          const startY = yMin + (yMax - yMin) * j / gridSize;
          const solution = newtonSolve(fCompiled, gCompiled, startX, startY);
          if (!solution) continue;

          const fCheck = safeEvaluate(fCompiled, solution.x, solution.y);
          const gCheck = safeEvaluate(gCompiled, solution.x, solution.y);
          if (Math.hypot(fCheck, gCheck) > 0.000001) continue;
          if (!isDuplicate(solution, solutions)) solutions.push(solution);
        }
      }

      solutions.sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);

      if (solutions.length === 0) {
        results.innerHTML = '<div class="solution-line">No solutions found.</div>';
        return;
      }

      results.innerHTML = solutions.map((sol, index) => {
        const n = index + 1;
        return '<div class="solution-line">(x<sub>' + n + '</sub>, y<sub>' + n + '</sub>) ≈ (' + formatNumber(sol.x) + ', ' + formatNumber(sol.y) + ')</div>';
      }).join('');
    }

    function clearAll() {
      document.getElementById("fInput").value = "";
      document.getElementById("gInput").value = "";
      document.getElementById("results").innerHTML = "";
    }
  </script>
</body>
</html>
