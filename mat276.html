<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAT276 — Math Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#111827;
      --muted:#4b5563;
      --line:#d1d5db;
      --accent:#2563eb;
      --bad:#b91c1c;
      --mono: ui-monospace, Menlo, Consolas, monospace;
      --sans: system-ui, Arial, sans-serif;
    }

    body{
      margin:0;
      font-family:var(--sans);
      background: radial-gradient(1200px 800px at 10% 0%, #e7efff 0%, var(--bg) 55%);
      color:var(--ink);
    }

    .wrap{ max-width:980px; margin:0 auto; padding:24px; }

    h1{ margin:0 0 6px; font-size:22px; }

    .sub{ color:var(--muted); font-size:14px; margin-bottom:18px; }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      margin-bottom:20px;
    }

    .integral-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    input{
      padding:10px;
      border:1px solid var(--line);
      border-radius:10px;
      font-family:var(--mono);
    }

    button{
      margin-top:12px;
      padding:10px 16px;
      font-weight:700;
      border-radius:10px;
      border:1px solid #c7d2fe;
      background:#e0e7ff;
      cursor:pointer;
    }

    .status{ margin-top:10px; font-size:13px; color:var(--muted); }

    .out{
      margin-top:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
    }

    .math{ font-size:18px; }

    .msg{
      margin-top:10px;
      padding:10px;
      border-radius:10px;
      border:1px solid rgba(185,28,28,.25);
      background:rgba(185,28,28,.06);
      color:var(--bad);
      display:none;
    }

    .pill{
      padding:2px 8px;
      border-radius:999px;
      background:#eee;
      font-family:var(--mono);
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- ===================== -->
  <!-- INTEGRAL CALCULATOR -->
  <!-- ===================== -->

  <h1>Indefinite Integral Calculator</h1>
  <div class="sub">Enter function and variable.</div>

  <div class="card">
    <div class="integral-row">
      <input id="expr" value="x^2" />
      <input id="variable" value="x" style="width:80px;" />
    </div>

    <button id="btnIntegrate" disabled>Loading…</button>
    <div class="status" id="status">Loading SymPy…</div>

    <div class="msg" id="friendlyError"></div>

    <div class="out">
      <div id="output" class="math">—</div>
    </div>
  </div>

  <!-- ===================== -->
  <!-- QUADRATIC CALCULATOR -->
  <!-- ===================== -->

  <h1>Quadratic Root Calculator</h1>
  <div class="sub">Solve \(ax^2 + bx + c = 0\)</div>

  <div class="card">
    <div class="integral-row">
      <input id="qa" value="1" placeholder="a" style="width:80px;">
      <input id="qb" value="0" placeholder="b" style="width:80px;">
      <input id="qc" value="-4" placeholder="c" style="width:80px;">
    </div>

    <button id="btnQuadratic">Compute Roots</button>
    <div class="status" id="quadraticStatus">Ready.</div>

    <div class="msg" id="quadraticError"></div>

    <div class="out">
      <div id="quadraticOutput" class="math">—</div>
    </div>
  </div>

</div>

<script>
let pyodide = null;

// ---------- SHARED ----------
function renderMath(){
  if (!window.renderMathInElement) return;
  renderMathInElement(document.body, {
    delimiters: [
      {left:"\\(", right:"\\)", display:false},
      {left:"\\[", right:"\\]", display:true}
    ]
  });
}

// ---------- INTEGRAL ----------
function setStatus(text){
  document.getElementById("status").textContent = text;
}

function showError(msg){
  const box = document.getElementById("friendlyError");
  box.style.display = "block";
  box.textContent = msg;
}

function clearError(){
  const box = document.getElementById("friendlyError");
  box.style.display = "none";
  box.textContent = "";
}

async function initPyodide(){
  pyodide = await loadPyodide();
  await pyodide.loadPackage("sympy");

  document.getElementById("btnIntegrate").disabled = false;
  document.getElementById("btnIntegrate").textContent = "Integrate";
  setStatus("Ready.");
}

async function integrate(){
  clearError();

  const expr = document.getElementById("expr").value;
  const v = document.getElementById("variable").value || "x";

  setStatus("Computing…");

  const code = `
import sympy as sp
x = sp.Symbol('${v}')
expr = sp.sympify(r'''${expr}''')
F = sp.integrate(expr, x)
sp.latex(F)
`;

  try{
    const result = await pyodide.runPythonAsync(code);
    document.getElementById("output").innerHTML = `\\(${result} + C\\)`;
    renderMath();
    setStatus("Done.");
  } catch(e){
    showError("Invalid expression.");
    setStatus("Error.");
  }
}

document.getElementById("btnIntegrate").addEventListener("click", integrate);

// ---------- QUADRATIC ----------
function computeQuadratic(){
  const a = Number(document.getElementById("qa").value);
  const b = Number(document.getElementById("qb").value);
  const c = Number(document.getElementById("qc").value);

  const out = document.getElementById("quadraticOutput");

  if (!a || isNaN(a)){
    out.textContent = "Invalid a";
    return;
  }

  const d = b*b - 4*a*c;

  let result;

  if (d >= 0){
    const r1 = (-b + Math.sqrt(d)) / (2*a);
    const r2 = (-b - Math.sqrt(d)) / (2*a);
    result = `\\(x = ${r1},\\; ${r2}\\)`;
  } else {
    const real = -b/(2*a);
    const imag = Math.sqrt(-d)/(2*a);
    result = `\\(x = ${real} \\pm ${imag}i\\)`;
  }

  out.innerHTML = result;
  renderMath();
}

document.getElementById("btnQuadratic").addEventListener("click", computeQuadratic);

// ---------- INIT ----------
initPyodide();
window.addEventListener("load", renderMath);
</script>

</body>
</html>
