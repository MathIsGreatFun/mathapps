<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAT276 — Indefinite Integral Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#111827;
      --muted:#4b5563;
      --line:#d1d5db;
      --accent:#2563eb;
      --bad:#b91c1c;
      --mono: ui-monospace, Menlo, Consolas, monospace;
      --sans: system-ui, Arial, sans-serif;
    }

    body{
      margin:0;
      font-family:var(--sans);
      background: radial-gradient(1200px 800px at 10% 0%, #e7efff 0%, var(--bg) 55%);
      color:var(--ink);
    }

    .wrap{ max-width:980px; margin:0 auto; padding:24px; }

    h1{ margin:0 0 6px; font-size:22px; }

    .sub{ color:var(--muted); font-size:14px; margin-bottom:18px; }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      margin-bottom:20px;
    }

    .row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .label{
      font-family:var(--mono);
      font-weight:700;
    }

    input{
      padding:8px;
      border:1px solid var(--line);
      border-radius:8px;
      font-family:var(--mono);
      width:80px;
      text-align:center;
    }

    input.long{
      width:260px;
      text-align:left;
    }

    button{
      margin-top:12px;
      padding:10px 16px;
      font-weight:700;
      border-radius:10px;
      border:1px solid #c7d2fe;
      background:#e0e7ff;
      cursor:pointer;
    }

    .status{ margin-top:10px; font-size:13px; color:var(--muted); }

    .out{
      margin-top:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
    }

    .math{ font-size:18px; }

    .msg{
      margin-top:10px;
      padding:10px;
      border-radius:10px;
      border:1px solid rgba(185,28,28,.25);
      background:rgba(185,28,28,.06);
      color:var(--bad);
      display:none;
    }
  </style>
</head>

<body>
<div class="wrap">

<!-- INTEGRAL (UNCHANGED FUNCTIONALITY) -->
<h1>Indefinite Integral Calculator</h1>
<div class="sub">Enter function and variable.</div>

<div class="card">
  <div class="row">
    <span class="label">∫</span>
    <input id="expr" class="long" value="1/(y*(1-y/800))">
    <span class="label">d</span>
    <input id="variable" value="y">
  </div>

  <button id="btnIntegrate" disabled>Loading…</button>
  <div class="status" id="status">Loading SymPy…</div>

  <div class="msg" id="friendlyError"></div>

  <div class="out">
    <div id="output" class="math">—</div>
  </div>
</div>

<!-- QUADRATIC -->
<h1>Quadratic Root Calculator</h1>
<div class="sub">Solve \(ax^2 + bx + c = 0\)</div>

<div class="card">
  <div class="row">
    <span class="label">a =</span><input id="qa" value="1">
    <span class="label">b =</span><input id="qb" value="0">
    <span class="label">c =</span><input id="qc" value="-4">
  </div>

  <button id="btnQuadratic">Compute Roots</button>

  <div class="out">
    <div id="quadraticOutput" class="math">—</div>
  </div>
</div>

<!-- PARTIAL FRACTIONS -->
<h1>Partial Fractions</h1>
<div class="card">
  <div class="row">
    <span class="label">f(x) =</span>
    <input id="pfdExpr" class="long" value="(3*x+5)/((x-1)*(x+2))">
  </div>

  <button id="btnPFD">Decompose</button>

  <div class="out"><div id="pfdOutput"></div></div>
</div>

<!-- SYSTEM -->
<h1>2×2 System Solver</h1>
<div class="card">
  <div class="row">
    <span class="label">a =</span><input id="sysA" value="2">
    <span class="label">b =</span><input id="sysB" value="3">
    <span class="label">f₁ =</span><input id="sysF1" value="7">
  </div>

  <div class="row">
    <span class="label">c =</span><input id="sysC" value="1">
    <span class="label">d =</span><input id="sysD" value="-1">
    <span class="label">f₂ =</span><input id="sysF2" value="1">
  </div>

  <button id="btnSystemSolve">Solve</button>

  <div class="out"><div id="systemOutput"></div></div>
</div>

<!-- COMPLETE THE SQUARE -->
<h1>Complete the Square</h1>
<div class="card">
  <div class="row">
    <span class="label">a =</span><input id="ctsA" value="1">
    <span class="label">b =</span><input id="ctsB" value="6">
    <span class="label">c =</span><input id="ctsC" value="5">
  </div>

  <button id="btnCTS">Compute</button>

  <div class="out"><div id="ctsOutput"></div></div>
</div>

</div>

<script>
let pyodide = null;

function renderMath(){
  if (!window.renderMathInElement) return;
  renderMathInElement(document.body,{delimiters:[{left:"\\(",right:"\\)",display:false}]});
}

async function initPyodide(){
  pyodide = await loadPyodide();
  await pyodide.loadPackage("sympy");
  btnIntegrate.disabled = false;
}

btnIntegrate.onclick = async () => {
  const code = `
import sympy as sp
x=sp.Symbol('${variable.value}')
expr=sp.sympify(r'''${expr.value}''')
sp.latex(sp.integrate(expr,x))
`;
  const r = await pyodide.runPythonAsync(code);
  output.innerHTML = `\\(${r}+C\\)`; renderMath();
};

btnQuadratic.onclick = ()=>{
  let a=+qa.value,b=+qb.value,c=+qc.value;
  let d=b*b-4*a*c;
  quadraticOutput.innerHTML = d>=0
    ? `\\(x=${(-b+Math.sqrt(d))/(2*a)}, ${(-b-Math.sqrt(d))/(2*a)}\\)`
    : `\\(x=${-b/(2*a)}\\pm${Math.sqrt(-d)/(2*a)}i\\)`;
  renderMath();
};

btnPFD.onclick = async ()=>{
  const code=`import sympy as sp;x=sp.Symbol('x');sp.latex(sp.apart(sp.sympify(r'''${pfdExpr.value}'''),x))`;
  const r=await pyodide.runPythonAsync(code);
  pfdOutput.innerHTML=`\\(${r}\\)`; renderMath();
};

btnSystemSolve.onclick = ()=>{
  let a=+sysA.value,b=+sysB.value,c=+sysC.value,d=+sysD.value,f1=+sysF1.value,f2=+sysF2.value;
  let det=a*d-b*c;
  systemOutput.innerHTML = det
    ? `k_1=${(f1*d-b*f2)/det}, k_2=${(a*f2-f1*c)/det}`
    : "No unique solution";
};

btnCTS.onclick = ()=>{
  let a=+ctsA.value,b=+ctsB.value,c=+ctsC.value;
  let h=-b/(2*a),k=c-b*b/(4*a);
  ctsOutput.innerHTML=`\\(${a}(x${h>=0?'-':'+'}${Math.abs(h)})^2${k>=0?'+':'-'}${Math.abs(k)}\\)`;
  renderMath();
};

initPyodide();
window.onload=renderMath;
</script>
</body>
</html>
