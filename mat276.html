<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAT276 — Indefinite Integral Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#111827;
      --muted:#4b5563;
      --line:#d1d5db;
      --bad:#b91c1c;
      --mono: ui-monospace, Menlo, Consolas, monospace;
      --sans: system-ui, Arial, sans-serif;
    }
    body{
      margin:0;
      font-family:var(--sans);
      background: radial-gradient(1200px 800px at 10% 0%, #e7efff 0%, var(--bg) 55%);
      color:var(--ink);
    }
    .wrap{ max-width:980px; margin:0 auto; padding:24px; }
    h1{ margin:0 0 6px; font-size:22px; }
    .sub{ color:var(--muted); font-size:14px; margin-bottom:18px; }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      margin-bottom:20px;
    }
    .integral-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    input{
      padding:10px;
      border:1px solid var(--line);
      border-radius:10px;
      font-family:var(--mono);
    }
    button{
      margin-top:12px;
      padding:10px 16px;
      font-weight:700;
      border-radius:10px;
      border:1px solid #c7d2fe;
      background:#e0e7ff;
      cursor:pointer;
    }
    .status{ margin-top:10px; font-size:13px; color:var(--muted); }
    .out{
      margin-top:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
    }
    .math{ font-size:18px; }
    .msg{
      margin-top:10px;
      padding:10px;
      border-radius:10px;
      border:1px solid rgba(185,28,28,.25);
      background:rgba(185,28,28,.06);
      color:var(--bad);
      display:none;
    }
    .pill{
      padding:2px 8px;
      border-radius:999px;
      background:#eee;
      font-family:var(--mono);
    }
  </style>
</head>

<body>
<div class="wrap">

<h1>Indefinite Integral Calculator</h1>
<div class="sub">Enter function and variable.</div>

<div class="card">
  <div class="integral-row">
    <input id="expr" value="x^2" />
    <input id="variable" value="x" style="width:80px;" />
  </div>

  <button id="btnIntegrate" disabled>Loading…</button>
  <div class="status" id="status">Loading SymPy…</div>

  <div class="msg" id="friendlyError"></div>

  <div class="out">
    <div id="output" class="math">—</div>
  </div>
</div>

<h1>Quadratic Root Calculator</h1>
<div class="sub">Solve \(ax^2 + bx + c = 0\)</div>

<div class="card">
  <div class="integral-row">
    <input id="qa" value="1">
    <input id="qb" value="0">
    <input id="qc" value="-4">
  </div>

  <button id="btnQuadratic">Compute Roots</button>
  <div class="status" id="quadraticStatus">Ready.</div>

  <div class="msg" id="quadraticError"></div>

  <div class="out">
    <div id="quadraticOutput" class="math">—</div>
  </div>
</div>

<h1>Partial Fractions</h1>
<div class="card">
  <input id="pfdExpr" value="(3*x+5)/((x-1)*(x+2))">
  <button id="btnPFD">Decompose</button>
  <div class="out"><div id="pfdOutput"></div></div>
</div>

<h1>System Solver</h1>
<div class="card">
  <input id="sysA" value="2">
  <input id="sysB" value="3">
  <input id="sysF1" value="7"><br><br>
  <input id="sysC" value="1">
  <input id="sysD" value="-1">
  <input id="sysF2" value="1">
  <button id="btnSystemSolve">Solve</button>
  <div class="out"><div id="systemOutput"></div></div>
</div>

<h1>Complete the Square</h1>
<div class="card">
  <input id="ctsA" value="1">
  <input id="ctsB" value="6">
  <input id="ctsC" value="5">
  <button id="btnCTS">Compute</button>
  <div class="out"><div id="ctsOutput"></div></div>
</div>

</div>

<script>
let pyodide = null;

function renderMath(){
  if (!window.renderMathInElement) return;
  renderMathInElement(document.body,{delimiters:[{left:"\\(",right:"\\)",display:false}]});
}

async function initPyodide(){
  pyodide = await loadPyodide();
  await pyodide.loadPackage("sympy");
  document.getElementById("btnIntegrate").disabled = false;
}

async function integrate(){
  const expr = document.getElementById("expr").value;
  const v = document.getElementById("variable").value;

  const code = `
import sympy as sp
x=sp.Symbol('${v}')
expr=sp.sympify(r'''${expr}''')
sp.latex(sp.integrate(expr,x))
`;

  const result = await pyodide.runPythonAsync(code);
  document.getElementById("output").innerHTML=`\\(${result}+C\\)`;
  renderMath();
}

document.getElementById("btnIntegrate").onclick=integrate;

document.getElementById("btnQuadratic").onclick=()=>{
  let a=+qa.value,b=+qb.value,c=+qc.value;
  let d=b*b-4*a*c;
  quadraticOutput.innerHTML = d>=0
    ? `\\(x=${(-b+Math.sqrt(d))/(2*a)},${(-b-Math.sqrt(d))/(2*a)}\\)`
    : `\\(x=${-b/(2*a)}\\pm${Math.sqrt(-d)/(2*a)}i\\)`;
  renderMath();
};

document.getElementById("btnPFD").onclick=async()=>{
  const expr=pfdExpr.value;
  const code=`import sympy as sp;x=sp.Symbol('x');sp.latex(sp.apart(sp.sympify(r'''${expr}'''),x))`;
  const r=await pyodide.runPythonAsync(code);
  pfdOutput.innerHTML=`\\(${r}\\)`;renderMath();
};

document.getElementById("btnSystemSolve").onclick=()=>{
  let a=+sysA.value,b=+sysB.value,c=+sysC.value,d=+sysD.value,f1=+sysF1.value,f2=+sysF2.value;
  let det=a*d-b*c;
  systemOutput.innerHTML = det
    ? `k_1=${(f1*d-b*f2)/det}, k_2=${(a*f2-f1*c)/det}`
    : "No unique solution";
};

document.getElementById("btnCTS").onclick=()=>{
  let a=+ctsA.value,b=+ctsB.value,c=+ctsC.value;
  let h=-b/(2*a),k=c-b*b/(4*a);
  ctsOutput.innerHTML=`\\(${a}(x${h>=0?'-':'+'}${Math.abs(h)})^2${k>=0?'+':'-'}${Math.abs(k)}\\)`;
  renderMath();
};

initPyodide();
window.onload=renderMath;
</script>
</body>
</html>
