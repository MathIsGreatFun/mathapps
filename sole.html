<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2×2 Linear System Solver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#111827;
      --muted:#4b5563;
      --line:#d1d5db;
      --accent:#2563eb;
      --bad:#b91c1c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    body{
      margin:0;
      font-family:var(--sans);
      background: radial-gradient(1200px 800px at 10% 0%, #e7efff 0%, var(--bg) 55%);
      color:var(--ink);
    }
    .wrap{ max-width:980px; margin:0 auto; padding:24px; }
    h1{ margin:0 0 6px; font-size:22px; }
    .sub{ color:var(--muted); font-size:14px; margin-bottom:18px; line-height:1.35; }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      box-shadow:0 10px 26px rgba(0,0,0,.06);
    }

    .eqs{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
    }

    .eq-row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .label{
      font-weight:800;
      color:var(--muted);
      width:32px;
      flex: 0 0 32px;
      user-select:none;
    }

    input[type="text"]{
      font-family:var(--mono);
      font-size:14px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:10px;
      outline:none;
      background:#fff;
      color:var(--ink);
      min-width: 260px;
      flex: 1 1 520px;
    }

    @media (max-width: 600px){
      input[type="text"]{ flex-basis: 100%; min-width: 0; }
      .label{ width:auto; flex:0 0 auto; }
    }

    .callout{
      margin-top:12px;
      padding:10px 12px;
      border-radius:10px;
      background:#eef2ff;
      border:1px solid #c7d2fe;
      font-size:13px;
      line-height:1.35;
    }
    .pill{
      display:inline-block;
      padding:2px 8px;
      border:1px solid rgba(17,24,39,.12);
      border-radius:999px;
      font-family:var(--mono);
      font-size:12px;
      background:rgba(0,0,0,.03);
    }

    button{
      margin-top:14px;
      padding:10px 16px;
      font-size:14px;
      font-weight:800;
      border-radius:10px;
      border:1px solid #c7d2fe;
      background:#e0e7ff;
      cursor:pointer;
    }
    button:hover{ background:#dbe5ff; }
    button:disabled{ opacity:.65; cursor:not-allowed; }

    .status{ margin-top:10px; font-size:13px; color:var(--muted); }

    .out{
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      overflow:auto;
    }
    .math{ font-size:18px; line-height:1.6; white-space:normal; }

    .msg{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(185,28,28,.25);
      background:rgba(185,28,28,.06);
      color:var(--bad);
      font-size:13px;
      line-height:1.35;
      display:none;
      white-space:pre-wrap;
    }

    details.debug{
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
    }
    details.debug pre{
      white-space:pre-wrap;
      background:rgba(0,0,0,.03);
      border:1px solid rgba(17,24,39,.10);
      border-radius:10px;
      padding:10px;
      overflow:auto;
      font-family:var(--mono);
      font-size:12px;
      color:#111827;
    }
  </style>
</head>

<body>
<div class="wrap">
  <h1>MAT225 — 2×2 Linear System Solver</h1>
  <div class="sub">
    Enter two linear equations in <span class="pill">x</span> and <span class="pill">y</span>, then click <b>Solve</b>.
  </div>

  <div class="card">
    <div class="eqs">
      <div class="eq-row">
        <div class="label">Eq1</div>
        <input id="eq1" type="text" spellcheck="false" autocomplete="off"
               value="2*x + 3*y = 7"
               placeholder="Example: 2*x + 3*y = 7" />
      </div>

      <div class="eq-row">
        <div class="label">Eq2</div>
        <input id="eq2" type="text" spellcheck="false" autocomplete="off"
               value="x - y = 1"
               placeholder="Example: x - y = 1" />
      </div>
    </div>

    <div class="callout">
      <b>IMPORTANT:</b>
      Use <span class="pill">*</span> for multiplication (e.g. <span class="pill">2*x</span>),
      and include an <span class="pill">=</span> sign in each equation.
    </div>

    <button id="btnSolve" disabled>Loading engine…</button>
    <div class="status" id="status">Initializing SymPy…</div>

    <div class="msg" id="friendlyError"></div>

    <div class="out">
      <div class="math" id="output">—</div>

      <!-- Instructor-only debug: hidden unless an error happens -->
      <details class="debug" id="debugDetails" style="display:none;">
        <summary>Show technical details (instructor)</summary>
        <pre id="debugText"></pre>
      </details>
    </div>
  </div>
</div>

<script>
let pyodide = null;

function renderMath(){
  if (!window.renderMathInElement) return;
  renderMathInElement(document.body, {
    delimiters: [
      {left:"\\(", right:"\\)", display:false},
      {left:"\\[", right:"\\]", display:true}
    ],
    throwOnError:false
  });
}

function setStatus(text){
  document.getElementById("status").textContent = text;
}

function showFriendlyError(msg, debug=null){
  const box = document.getElementById("friendlyError");
  box.style.display = "block";
  box.textContent = msg;

  const dbg = document.getElementById("debugDetails");
  const dbgText = document.getElementById("debugText");
  if (debug){
    dbg.style.display = "block";
    dbgText.textContent = String(debug);
  } else {
    dbg.style.display = "none";
    dbgText.textContent = "";
  }
}

function clearFriendlyError(){
  const box = document.getElementById("friendlyError");
  box.style.display = "none";
  box.textContent = "";
  document.getElementById("debugDetails").style.display = "none";
  document.getElementById("debugText").textContent = "";
}

function sanitizeForPythonTripleQuotes(s){
  return String(s).replace(/'''/g, "\\'\\'\\'");
}

function normalizeEquationInput(s){
  // Make student entry forgiving: allow 2x, 3(y+1), x(y+1), etc.
  let t = String(s);

  // Power
  t = t.replace(/\^/g, "**");

  // 2x -> 2*x, 3y -> 3*y, 4(x+1) -> 4*(x+1)
  t = t.replace(/(\d)\s*([xy(])/gi, "$1*$2");

  // )x, )y, )(, )2  -> )*x, )*y, )*(, )*2
  t = t.replace(/(\))\s*([xy(\d])/gi, "$1*$2");

  // x( -> x*( , y( -> y*(
  t = t.replace(/([xy])\s*\(/gi, "$1*(");

  return t.replace(/\s+/g, " ").trim();
}

async function initPyodide(){
  pyodide = await loadPyodide();
  await pyodide.loadPackage("sympy");

  const btn = document.getElementById("btnSolve");
  btn.disabled = false;
  btn.textContent = "Solve";
  setStatus("Ready.");
}

async function solveSystem(){
  clearFriendlyError();

  const raw1 = document.getElementById("eq1").value.trim();
  const raw2 = document.getElementById("eq2").value.trim();

  if (!raw1 || !raw2){
    showFriendlyError("Please enter BOTH equations.");
    return;
  }
  if (!raw1.includes("=") || !raw2.includes("=")){
    showFriendlyError("Each line must include an '=' sign, for example: 2*x + 3*y = 7");
    return;
  }

  const eq1 = normalizeEquationInput(raw1);
  const eq2 = normalizeEquationInput(raw2);

  // Guard: keep it to numbers, x, y, and basic operators.
  const allowed = /^[0-9xyXY+\-*/().=\s]*$/;
  if (!allowed.test(eq1) || !allowed.test(eq2)){
    showFriendlyError(
      "I can only accept numbers, x, y, parentheses, and + − * / ^ in this solver.\n" +
      "Tip: use 2*x instead of 2x, and make sure your equations only use x and y."
    );
    return;
  }

  setStatus("Computing…");

  const eq1Safe = sanitizeForPythonTripleQuotes(eq1);
  const eq2Safe = sanitizeForPythonTripleQuotes(eq2);

  const code = `
import sympy as sp
x, y = sp.symbols('x y')

def to_eq(s):
    lhs, rhs = [p.strip() for p in s.split("=", 1)]
    return sp.Eq(sp.sympify(lhs, locals={'x':x,'y':y}),
                 sp.sympify(rhs, locals={'x':x,'y':y}))

E1 = to_eq(r'''${eq1Safe}''')
E2 = to_eq(r'''${eq2Safe}''')

sol = sp.linsolve([E1, E2], (x, y))

E1_tex = sp.latex(E1)
E2_tex = sp.latex(E2)

if len(sol) == 0:
    status = "no_solution"
    sol_tex = ""
else:
    tup = list(sol)[0]
    free = list(tup.free_symbols - {x, y})
    if free:
        status = "infinitely_many"
        sol_tex = sp.latex(sol)   # show the whole solution set (parametric)
    else:
        status = "unique"
        sol_tex = sp.latex(tup)   # show (x,y)

status + "|||"+ E1_tex + "|||"+ E2_tex + "|||"+ sol_tex
`;

  try{
    const joined = await pyodide.runPythonAsync(code);
    const parts = String(joined).split("|||");
    const status = parts[0] || "";
    const e1Tex  = parts[1] || "";
    const e2Tex  = parts[2] || "";
    const solTex = parts[3] || "";

    // OUTPUT ONLY: system + solution set (x,y) (or empty / parametric set)
    let html = `\\[\\begin{cases}${e1Tex}\\\\${e2Tex}\\end{cases}\\]`;

    if (status === "unique"){
      html += `\\[ (x,y) = ${solTex} \\]`;
    } else if (status === "no_solution"){
      html += `\\[ \\text{Solution set: } \\varnothing \\]`;
    } else if (status === "infinitely_many"){
      html += `\\[ \\text{Solution set: } ${solTex} \\]`;
    } else {
      html += `\\[ \\text{Solution set: (not determined)} \\]`;
    }

    document.getElementById("output").innerHTML = html;
    setStatus("Done.");
    renderMath();
  } catch(e){
    showFriendlyError(
      "I couldn’t parse/solve that system. Double-check:\n" +
      "• Use * for multiplication (2*x, 3*y)\n" +
      "• Include '=' in both equations\n" +
      "• Use only variables x and y\n" +
      "Then try again.",
      e
    );
    setStatus("Not computed.");
    document.getElementById("output").textContent = "—";
  }
}

document.getElementById("btnSolve").addEventListener("click", solveSystem);

// Enter key convenience
document.getElementById("eq1").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); solveSystem(); }
});
document.getElementById("eq2").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); solveSystem(); }
});

initPyodide();
window.addEventListener("load", renderMath);
</script>
</body>
</html>
